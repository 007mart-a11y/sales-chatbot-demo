<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sales chatbot – test</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:20px;background:#f6f7f8}
    .wrap{max-width:900px;margin:0 auto}
    .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    h1{margin:0 0 6px;font-size:20px}
    .sub{font-size:13px;color:#666;margin-bottom:12px}
    .chat{min-height:420px;max-height:65vh;overflow:auto;border:1px solid #e5e5e5;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
    .msg{padding:10px 12px;border-radius:14px;white-space:pre-wrap;max-width:92%}
    .user{align-self:flex-end;background:#dff7e8}
    .bot{align-self:flex-start;background:#f1f3f5}
    .row{display:flex;gap:8px;margin-top:12px}
    input{flex:1;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px}
    button{padding:12px 14px;border-radius:12px;border:0;font-weight:700;cursor:pointer}
    .btn{background:#0b5;color:#fff}
    .btn2{background:#eee}
    .meta{margin-top:10px;font-size:12px;color:#555;display:flex;gap:10px;flex-wrap:wrap}
    .pill{background:#f0f0f0;padding:4px 8px;border-radius:999px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Sales chatbot – debug</h1>
    <div class="sub">
      ✔ drží paměť (thread_id) · ✔ ukáže co jde do Sheets · ✔ ukáže odpověď ze Sheets
    </div>

    <div id="chat" class="chat"></div>

    <div class="row">
      <input id="input" placeholder="Napiš zprávu…" autocomplete="off">
      <button id="send" class="btn">Odeslat</button>
      <button id="reset" class="btn2">Nový chat</button>
    </div>

    <div class="meta">
      <span class="pill" id="threadInfo">thread_id: –</span>
      <span class="pill" id="status">stav: připraveno</span>
    </div>
  </div>
</div>

<script>
/* ================= PAMĚŤ THREADU ================= */
const THREAD_KEY = "sales_chatbot_thread_id";
const getThreadId = () => localStorage.getItem(THREAD_KEY) || "";
const setThreadId = id => id && localStorage.setItem(THREAD_KEY, id);
const resetThread = () => localStorage.removeItem(THREAD_KEY);

/* ================= UI ================= */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");
const threadInfo = document.getElementById("threadInfo");
const statusEl = document.getElementById("status");

function setStatus(t){ statusEl.textContent = "stav: " + t; }
function updateThread(){ threadInfo.textContent = "thread_id: " + (getThreadId() || "–"); }

function add(role, text){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

/* ================= LEAD → SHEETS ================= */
async function sendLead(lead){
  try{
    const r = await fetch("/.netlify/functions/lead",{
      method:"POST",
      headers:{ "content-type":"application/json" },
      body:JSON.stringify(lead)
    });
    const txt = await r.text();
    return { ok:r.ok, raw:txt };
  }catch(e){
    return { ok:false, raw:String(e) };
  }
}

/* ================= PARSE JSON Z ODPOVĚDI ================= */
function extractLead(text){
  const a = text.indexOf("{");
  const b = text.lastIndexOf("}");
  if(a===-1||b===-1||b<=a) return null;
  try{
    const o = JSON.parse(text.slice(a,b+1));
    if(o.name && o.phone){
      return {
        name:String(o.name),
        phone:String(o.phone),
        email:String(o.email||""),
        message:String(o.message||"")
      };
    }
  }catch{}
  return null;
}

/* ================= CHAT → BACKEND ================= */
async function askBot(text){
  const r = await fetch("/.netlify/functions/search",{
    method:"POST",
    headers:{ "content-type":"application/json" },
    body:JSON.stringify({
      message:text,
      thread_id:getThreadId()
    })
  });
  const d = await r.json();
  if(d.thread_id) setThreadId(d.thread_id);
  updateThread();
  if(!d.ok) throw d.error;
  return d.answer;
}

/* ================= SEND ================= */
async function send(){
  const t = input.value.trim();
  if(!t) return;

  if(t.toLowerCase()==="reset"){
    resetThread();
    chat.innerHTML="";
    updateThread();
    add("bot","Nový chat ✅ Pro jaký obor podnikání řešení hledáte?");
    return;
  }

  add("user",t);
  input.value="";
  setStatus("generuji…");
  sendBtn.disabled=true;

  try{
    const ans = await askBot(t);
    add("bot",ans);

    const lead = extractLead(ans);
    if(lead){
      add("bot","📤 Odesílám do Sheets:\n"+JSON.stringify(lead,null,2));
      setStatus("odesílám do Sheets…");
      const r = await sendLead(lead);
      if(r.ok){
        add("bot","✅ Sheets odpověď:\n"+r.raw);
        setStatus("uloženo do Sheets");
      }else{
        add("bot","❌ Chyba Sheets:\n"+r.raw);
        setStatus("chyba Sheets");
      }
    }else{
      setStatus("připraveno");
    }
  }catch(e){
    add("bot","❌ Chyba:\n"+e);
    setStatus("chyba");
  }finally{
    sendBtn.disabled=false;
    input.focus();
  }
}

/* ================= EVENTS ================= */
sendBtn.onclick = send;
input.addEventListener("keydown",e=>e.key==="Enter"&&send());
resetBtn.onclick = ()=>{
  resetThread();
  chat.innerHTML="";
  updateThread();
  add("bot","Nový chat ✅ Pro jaký obor podnikání řešení hledáte?");
};

/* ================= INIT ================= */
updateThread();
add("bot","Dobrý den 👋 Pro jaký obor podnikání řešení hledáte?");
</script>
</body>
</html>
