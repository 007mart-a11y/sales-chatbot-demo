<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI-Proces | Chatbot DEMO</title>
  <style>
    :root{
      --bg0: #070A12;
      --bg1: rgba(255,255,255,.06);
      --bg2: rgba(255,255,255,.09);
      --stroke: rgba(255,255,255,.12);
      --stroke2: rgba(0,255,255,.22);
      --txt: rgba(255,255,255,.90);
      --muted: rgba(255,255,255,.68);
      --muted2: rgba(255,255,255,.56);

      --brand: rgba(0, 230, 255, .95);
      --brand2: rgba(0, 160, 255, .95);

      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 18px;

      --bubbleUser: rgba(0, 200, 255, .18);
      --bubbleBot: rgba(255,255,255,.08);
      --bubbleStroke: rgba(255,255,255,.14);
    }

    *{ box-sizing: border-box; }
    html, body{ height:100%; width:100%; margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial; background: var(--bg0); color: var(--txt); }
    a{ color: inherit; }

    /* ====== EMBED FILL pro Lovable ====== */
    body.embed-mode { background: transparent; }
    #appRoot{
      height:100%;
      width:100%;
      display:flex;
      align-items:stretch;
      justify-content:stretch;
      padding: 0;
    }

    .panel{
      width: 420px;
      height: 640px;
      border-radius: var(--radius);
      overflow:hidden;
      border: 1px solid var(--stroke);
      background:
        radial-gradient(1200px 800px at 15% 10%, rgba(0,200,255,.18), transparent 55%),
        radial-gradient(1000px 700px at 85% 20%, rgba(0,140,255,.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      position: relative;
    }

    /* Když jsme v iframe slotu (Lovable embed), vyplň panel celý prostor */
    body.embed-mode .panel{
      width:100%;
      height:100%;
      border-radius: 14px;
      box-shadow: none;
      border: 1px solid rgba(255,255,255,.10);
    }

    /* ====== HEADER ====== */
    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(0,0,0,.24), rgba(0,0,0,.10));
      backdrop-filter: blur(10px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }
    .brandIcon{
      width: 34px;
      height: 34px;
      display:grid;
      place-items:center;
      border-radius: 12px;
      border: 1px solid rgba(0,255,255,.25);
      background: linear-gradient(180deg, rgba(0,230,255,.18), rgba(0,120,255,.10));
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      flex: 0 0 auto;
      color: rgba(0,230,255,.95);
    }
    .brandText{ min-width:0; }
    .brandTitle{
      font-weight: 800;
      letter-spacing: .2px;
      line-height: 1.05;
      font-size: 14px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .brandSub{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.05;
      margin-top: 2px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .closeBtn{
      appearance:none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.85);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      cursor:pointer;
      display:grid;
      place-items:center;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .closeBtn:hover{
      background: rgba(255,255,255,.09);
      border-color: rgba(0,255,255,.22);
      transform: translateY(-1px);
    }

    /* ====== MESSAGES ====== */
    .messages{
      flex: 1 1 auto;
      overflow:auto;
      padding: 14px 14px 10px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar{ width: 10px; }
    .messages::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.10); border-radius: 999px; }
    .messages::-webkit-scrollbar-track{ background: transparent; }

    .msgRow{
      display:flex;
      margin: 8px 0;
      gap: 10px;
      align-items:flex-end;
    }
    .msgRow.user{ justify-content:flex-end; }
    .msgRow.bot{ justify-content:flex-start; }

    .bubble{
      max-width: 82%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--bubbleStroke);
      background: var(--bubbleBot);
      line-height: 1.35;
      font-size: 14px;
      color: var(--txt);
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    .msgRow.user .bubble{
      background: var(--bubbleUser);
      border-color: rgba(0,255,255,.18);
    }

    .bubble .kicker{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: .2px;
    }
    .pill{
      display:inline-flex;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid rgba(0,255,255,.22);
      color: rgba(0,240,255,.95);
      background: rgba(0,220,255,.10);
      margin-right: 6px;
      vertical-align: middle;
    }
    .small{
      color: var(--muted);
      font-size: 13px;
    }
    .divider{
      height: 1px;
      background: rgba(255,255,255,.10);
      margin: 10px 0;
    }

    .chips{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .chip{
      appearance:none;
      border: 1px solid rgba(0,255,255,.20);
      background: rgba(0,210,255,.10);
      color: rgba(255,255,255,.92);
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      font-size: 13px;
    }
    .chip:hover{
      transform: translateY(-1px);
      background: rgba(0,210,255,.14);
      border-color: rgba(0,255,255,.28);
    }

    /* ====== TYPING DOTS ====== */
    .typing{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
    }
    .typingDot{
      width: 7px; height: 7px; border-radius: 999px;
      background: rgba(255,255,255,.70);
      animation: bounce 1.2s infinite ease-in-out;
      opacity: .65;
    }
    .typingDot:nth-child(2){ animation-delay: .15s; }
    .typingDot:nth-child(3){ animation-delay: .30s; }
    @keyframes bounce{
      0%, 80%, 100%{ transform: translateY(0); opacity: .55; }
      40%{ transform: translateY(-6px); opacity: 1; }
    }

    /* ====== INPUT ====== */
    .composer{
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.24));
      display:flex;
      gap: 10px;
      align-items:flex-end;
    }
    .inputWrap{
      flex: 1 1 auto;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      border-radius: 14px;
      padding: 10px 10px;
      display:flex;
      align-items:center;
      gap: 8px;
    }
    textarea{
      width:100%;
      resize:none;
      border:0;
      outline:none;
      background: transparent;
      color: rgba(255,255,255,.92);
      font-size: 14px;
      line-height: 1.35;
      max-height: 120px;
      min-height: 22px;
    }
    textarea::placeholder{ color: rgba(255,255,255,.45); }

    .sendBtn{
      appearance:none;
      border: 1px solid rgba(0,255,255,.22);
      background: linear-gradient(180deg, rgba(0,230,255,.28), rgba(0,140,255,.18));
      color: rgba(255,255,255,.95);
      font-weight: 900;
      letter-spacing: .2px;
      border-radius: 14px;
      padding: 12px 14px;
      cursor:pointer;
      transition: transform .12s ease, filter .12s ease;
      box-shadow: 0 12px 28px rgba(0,0,0,.28);
    }
    .sendBtn:hover{ transform: translateY(-1px); filter: brightness(1.05); }
    .sendBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
      filter:none;
    }

    /* ====== MODAL (FULL VERSION LEAD) ====== */
    .modalOverlay{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 50;
    }
    .modalOverlay.show{ display:flex; }
    .modal{
      width: min(520px, 100%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(800px 500px at 20% 0%, rgba(0,220,255,.16), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05));
      box-shadow: 0 24px 80px rgba(0,0,0,.60);
      overflow:hidden;
    }
    .modalHead{
      padding: 12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .modalTitle{ font-weight: 900; letter-spacing:.2px; }
    .modalClose{
      appearance:none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.85);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      cursor:pointer;
    }
    .modalBody{
      padding: 14px;
    }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: 1fr; }
    }
    .field label{
      display:block;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 6px;
      font-weight: 700;
    }
    .field input, .field textarea{
      width:100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.92);
      padding: 10px 10px;
      outline:none;
      font-size: 14px;
    }
    .field textarea{ min-height: 90px; resize: vertical; }
    .modalActions{
      display:flex;
      gap: 10px;
      justify-content:flex-end;
      padding: 0 14px 14px;
    }
    .btn{
      appearance:none;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      cursor:pointer;
    }
    .btnPrimary{
      border: 1px solid rgba(0,255,255,.22);
      background: linear-gradient(180deg, rgba(0,230,255,.28), rgba(0,140,255,.18));
    }
    .hint{
      font-size: 12px;
      color: rgba(255,255,255,.58);
      margin-top: 8px;
      line-height: 1.3;
    }
  </style>
</head>

<body>
  <div id="appRoot"></div>

  <script>
    /******************************************************************
     *  KONFIG
     ******************************************************************/
    const APP_ORIGIN = "https://sales-chatbot-demo.netlify.app";
    const ENDPOINT_SEARCH = APP_ORIGIN + "/.netlify/functions/search";
    const ENDPOINT_LEAD  = APP_ORIGIN + "/.netlify/functions/lead";

    const LS_THREAD = "sales_chatbot_thread_id_v2";
    const LS_DEMO_STATE = "sales_chatbot_demo_state_v4";
    const LS_MSG_COUNT = "sales_chatbot_user_msg_count_v4";
    const LS_NUDGE_DONE = "sales_chatbot_nudge_done_v4";

    // ✅ NEW: Mode state (demo/sales)
    const LS_MODE = "sales_chatbot_mode_v1"; // "demo" | "sales"

    const params = new URLSearchParams(location.search);
    const IS_EMBED = params.get("embed") === "1";

    // heuristika: doména
    function normalizeDomain(text){
      if(!text) return "";
      let t = text.trim();
      t = t.replace(/^https?:\/\//i, "");
      t = t.replace(/^www\./i, "www.");
      t = t.split(/[\/\s]/)[0];
      if(!t.includes(".")) return "";
      return t;
    }

    // jednoduché odvození názvu firmy z domény
    function companyFromDomain(domain){
      try{
        const d = domain.replace(/^www\./i,"");
        const base = d.split(".")[0] || d;
        const nice = base.charAt(0).toUpperCase() + base.slice(1);
        return nice;
      }catch(e){ return "Vaše firma"; }
    }

    function el(tag, attrs={}, children=[]){
      const node = document.createElement(tag);
      for(const [k,v] of Object.entries(attrs)){
        if(k === "class") node.className = v;
        else if(k === "html") node.innerHTML = v;
        else if(k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      }
      for(const c of children){
        if(c == null) continue;
        if(typeof c === "string") node.appendChild(document.createTextNode(c));
        else node.appendChild(c);
      }
      return node;
    }

    function escapeHtml(str){
      return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function scrollToBottom(){
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(role, html){
      const row = el("div", { class: "msgRow " + (role === "user" ? "user" : "bot") });
      const bubble = el("div", { class: "bubble", html });
      row.appendChild(bubble);
      messages.appendChild(row);
      scrollToBottom();
      return row;
    }

    function addTyping(){
      const row = el("div", { class: "msgRow bot" });
      const bubble = el("div", { class: "typing", "aria-label": "Generuje se odpověď" }, [
        el("span", { class:"typingDot" }),
        el("span", { class:"typingDot" }),
        el("span", { class:"typingDot" }),
      ]);
      row.appendChild(bubble);
      row.dataset.typing = "1";
      messages.appendChild(row);
      scrollToBottom();
      return row;
    }

    function removeTyping(){
      const t = messages.querySelector('[data-typing="1"]');
      if(t) t.remove();
    }

    function setUserCount(n){ localStorage.setItem(LS_MSG_COUNT, String(n)); }
    function getUserCount(){ return parseInt(localStorage.getItem(LS_MSG_COUNT) || "0", 10) || 0; }

    function setDemoState(state){ localStorage.setItem(LS_DEMO_STATE, JSON.stringify(state)); }
    function getDemoState(){
      try{ return JSON.parse(localStorage.getItem(LS_DEMO_STATE) || "null"); }
      catch(e){ return null; }
    }

    function setThreadId(id){ if(id) localStorage.setItem(LS_THREAD, id); }
    function getThreadId(){ return localStorage.getItem(LS_THREAD) || ""; }
    function resetThread(){ localStorage.removeItem(LS_THREAD); }

    function markNudgeDone(){ localStorage.setItem(LS_NUDGE_DONE, "1"); }
    function isNudgeDone(){ return localStorage.getItem(LS_NUDGE_DONE) === "1"; }
    function resetNudge(){ localStorage.removeItem(LS_NUDGE_DONE); }

    // ✅ NEW: Mode helpers
    function setMode(mode){ localStorage.setItem(LS_MODE, mode); }
    function getMode(){ return localStorage.getItem(LS_MODE) || "demo"; }
    function resetMode(){ localStorage.removeItem(LS_MODE); }

    /******************************************************************
     *  UI BUILD
     ******************************************************************/
    if(IS_EMBED) document.body.classList.add("embed-mode");

    const root = document.getElementById("appRoot");
    const panel = el("div", { class: "panel", role:"region", "aria-label":"AI-Proces Chatbot DEMO" });

    const header = el("div", { class: "header" });
    const brand = el("div", { class: "brand" });

    const brandIcon = el("div", { class:"brandIcon", title:"AI-Proces" });
    brandIcon.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8V4H8"></path>
        <rect width="16" height="12" x="4" y="8" rx="2"></rect>
        <path d="M2 14h2"></path>
        <path d="M20 14h2"></path>
        <path d="M15 13v2"></path>
        <path d="M9 13v2"></path>
      </svg>
    `;

    const brandText = el("div", { class:"brandText" }, [
      el("div", { class:"brandTitle" }, ["AI-Proces"]),
      el("div", { class:"brandSub" }, ["DEMO • načtena pouze homepage"])
    ]);

    brand.appendChild(brandIcon);
    brand.appendChild(brandText);

    const closeBtn = el("button", { class:"closeBtn", "aria-label":"Zavřít", onclick: () => {
      if(IS_EMBED){
        addMessage("bot", `<span class="pill">DEMO</span>Okno můžete kdykoliv znovu otevřít v sekci DEMO na stránce.`);
        scrollToBottom();
      }else{
        panel.style.display = "none";
      }
    }}, ["×"]);

    header.appendChild(brand);
    header.appendChild(closeBtn);

    const messages = el("div", { class:"messages", id:"messages" });

    const composer = el("div", { class:"composer" });
    const inputWrap = el("div", { class:"inputWrap" });
    const ta = el("textarea", { id:"msg", rows:"1", placeholder:"Napište dotaz… (např. cena, služby, kontakt)" });
    inputWrap.appendChild(ta);

    const sendBtn = el("button", { class:"sendBtn", id:"sendBtn" }, ["Odeslat"]);
    composer.appendChild(inputWrap);
    composer.appendChild(sendBtn);

    // Modal
    const modalOverlay = el("div", { class:"modalOverlay", id:"modalOverlay" });
    const modal = el("div", { class:"modal" });
    const modalHead = el("div", { class:"modalHead" });
    const modalTitle = el("div", { class:"modalTitle" }, ["Ukázat plnou verzi"]);
    const modalClose = el("button", { class:"modalClose", onclick: ()=>hideModal(), "aria-label":"Zavřít formulář" }, ["×"]);
    modalHead.appendChild(modalTitle);
    modalHead.appendChild(modalClose);

    const modalBody = el("div", { class:"modalBody" });
    const form = el("form", { id:"leadForm" });
    const grid = el("div", { class:"grid" });

    function field(label, type, name, placeholder){
      return el("div", { class:"field" }, [
        el("label", {}, [label]),
        el("input", { type, name, placeholder })
      ]);
    }

    const fName  = field("Jméno", "text", "name", "Jan Novák");
    const fEmail = field("E-mail", "email", "email", "jan@firma.cz");
    const fPhone = field("Telefon", "tel", "phone", "777 123 456");
    const fWeb   = field("Web / doména", "text", "web", "www.firma.cz");

    grid.appendChild(fName);
    grid.appendChild(fEmail);
    grid.appendChild(fPhone);
    grid.appendChild(fWeb);

    const fMsg = el("div", { class:"field" }, [
      el("label", {}, ["Co by měl chatbot umět? (stručně)"]),
      el("textarea", { name:"message", placeholder:"Např. odpovědi na služby a ceny, sběr poptávek, přesměrování na kontakt…" })
    ]);

    const hint = el("div", { class:"hint" }, [
      "DEMO používá pouze homepage. V plné verzi se napojíme na celý web a nastavíme sběr poptávek."
    ]);

    const actions = el("div", { class:"modalActions" });
    const btnCancel = el("button", { type:"button", class:"btn", onclick: ()=>hideModal() }, ["Zavřít"]);
    const btnSend = el("button", { type:"submit", class:"btn btnPrimary", id:"leadSubmit" }, ["Odeslat"]);
    actions.appendChild(btnCancel);
    actions.appendChild(btnSend);

    form.appendChild(grid);
    form.appendChild(el("div", { style:"height:10px" }));
    form.appendChild(fMsg);
    form.appendChild(hint);

    modalBody.appendChild(form);
    modal.appendChild(modalHead);
    modal.appendChild(modalBody);
    modal.appendChild(actions);
    modalOverlay.appendChild(modal);
    panel.appendChild(modalOverlay);

    panel.appendChild(header);
    panel.appendChild(messages);
    panel.appendChild(composer);
    root.appendChild(panel);

    function showModal(prefill = {}){
      if(prefill.web) form.querySelector('input[name="web"]').value = prefill.web;
      modalOverlay.classList.add("show");
      setTimeout(()=> form.querySelector('input[name="name"]').focus(), 80);
    }
    function hideModal(){ modalOverlay.classList.remove("show"); }

    /******************************************************************
     *  DEMO COPY + FLOW
     ******************************************************************/
    function intro(){
      addMessage("bot", `
        <div class="kicker"><span class="pill">DEMO</span>Rychlá ukázka chatbota pro váš web</div>
        <div class="small">
          Zadejte <b>doménu</b> (např. <b>dachmantechnik.cz</b>) a během chvilky připravím <b>DEMO ukázku</b>.
          <br><br>
          <b>Upozornění:</b> V této DEMO verzi je načtena pouze <b>homepage</b> vašeho webu.
          Odpovědi jsou orientační a slouží k ukázce chování chatbota.
          <br><br>
          V <b>plné verzi</b> chatbot pracuje s celým webem, odpovídá přesněji, sbírá poptávky a navádí návštěvníky ke správné službě nebo kontaktu.
        </div>
        <div class="divider"></div>
        <div class="small"><b>Zkuste to:</b> napište doménu nebo rovnou položte dotaz (cena, služby, termíny, kontakt).</div>
      `);

      const state = getDemoState();
      if(state?.domain){
        addMessage("bot", `
          <span class="pill">DEMO</span>Posledně zadaný web: <b>${escapeHtml(state.domain)}</b> (firma: <b>${escapeHtml(state.company)}</b>).
          <div class="small" style="margin-top:6px">Načten je pouze obsah <b>homepage</b>. Odpovědi jsou orientační.</div>
        `);
        quickButtons(state);
      }
    }

    function quickButtons(state){
      addMessage("bot", `
        <div class="kicker">Chcete si to hned vyzkoušet?</div>
        <div class="small">
          Klikněte na jednu z ukázkových otázek, nebo napište vlastní dotaz.
          <br>
          <span style="opacity:.8">DEMO pracuje pouze s obsahem homepage.</span>
        </div>

        <div class="chips">
          <button class="chip"
            data-q="Co víš o firmě ${escapeHtml(state.company)} (${escapeHtml(state.domain)})? Vím, že jde o DEMO a mám k dispozici jen homepage.">
            Co víš o této firmě?
          </button>

          <button class="chip"
            data-q="Jak by si mohl zákazník objednat služby firmy ${escapeHtml(state.company)} na webu ${escapeHtml(state.domain)}? Odpovídej jen z informací, které bývají na homepage.">
            Jak si mohu službu objednat?
          </button>

          <button class="chip"
            data-q="Kolik to může orientačně stát a jak rychle lze řešení nasadit pro web ${escapeHtml(state.domain)}? Pokud přesná cena není na homepage, uveď to.">
            Kolik to stojí a jak rychle to nasadíte?
          </button>
        </div>
      `);

      const last = messages.lastElementChild;
      const btns = last.querySelectorAll(".chip");
      btns.forEach(btn => {
        btn.addEventListener("click", () => {
          const q = btn.getAttribute("data-q") || btn.textContent.trim();
          sendUserText(q);
        });
      });
    }

    function demoReady(domain){
      const company = companyFromDomain(domain);
      const state = { domain, company };

      // ✅ reset kontextu pro novou doménu
      resetThread();
      setUserCount(0);
      resetNudge();

      // ✅ vždy zpět do DEMO módu při zadání nové domény
      setMode("demo");

      setDemoState(state);

      addMessage("bot", `
        <span class="pill">DEMO</span>Hotovo ✅ Ukázka je připravena pro firmu <b>${escapeHtml(company)}</b> (<b>${escapeHtml(domain)}</b>).
        <div class="small" style="margin-top:6px">
          V této ukázce je použit pouze obsah <b>homepage</b>. Odpovědi jsou orientační.
        </div>
        <div class="small" style="margin-top:8px">
          Teď se zeptejte jako zákazník: <b>cena</b>, <b>služby</b>, <b>termín</b>, <b>kontakt</b>… (nebo klikněte na připravené otázky).
        </div>
      `);

      quickButtons(state);
    }

    /******************************************************************
     *  SALES NUDGE
     ******************************************************************/
    function maybeNudge(){
      const count = getUserCount();
      if(isNudgeDone()) return;
      if(count < 3) return;

      markNudgeDone();

      addMessage("bot", `
        <div class="kicker">Chcete vidět plnou verzi na vašem webu?</div>
        <div class="small">
          V plné verzi chatbot odpovídá z celého webu (ne jen z homepage), sbírá poptávky a umí návštěvníky směřovat na správné služby.
        </div>
        <div class="chips">
          <button class="chip" data-nudge="yes">Ano, ukázat plnou verzi</button>
          <button class="chip" data-nudge="no">Ne, pokračovat v DEMO</button>
        </div>
      `);

      const last = messages.lastElementChild;

      // ✅ YES => přepnout do SALES + reset threadu (nový kontext)
      last.querySelector('[data-nudge="yes"]').addEventListener("click", ()=>{
        const st = getDemoState();

        setMode("sales");
        resetThread();

        showModal({ web: st?.domain || "" });
      });

      last.querySelector('[data-nudge="no"]').addEventListener("click", ()=>{
        addMessage("bot", `<span class="pill">DEMO</span>Jasně — klidně pokračujte otázkou. 🙂`);
      });
    }

    /******************************************************************
     *  BACKEND CALL
     ******************************************************************/
    async function callAssistant(userText){
      const thread_id = getThreadId() || undefined;

      const payload = { message: userText };
      if(thread_id) payload.thread_id = thread_id;

      const res = await fetch(ENDPOINT_SEARCH, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(()=>null);
      if(!data || data.ok !== true){
        const err = data?.error || "Chyba serveru";
        const det = data?.details ? ("<div class='small' style='margin-top:6px'>" + escapeHtml(String(data.details)) + "</div>") : "";
        return { ok:false, answer: `Omlouvám se, něco se nepovedlo. (${escapeHtml(err)})${det}` };
      }

      if(data.thread_id) setThreadId(data.thread_id);
      return { ok:true, answer: data.answer || "OK" };
    }
        /******************************************************************
     *  SEND FLOW
     ******************************************************************/
    async function sendUserText(text){
      const t = (text || "").trim();
      if(!t) return;

      // doména -> DEMO příprava
      const maybeDomain = normalizeDomain(t);
      if(maybeDomain && !t.includes(" ")){
        addMessage("user", escapeHtml(t));
        ta.value = "";
        autosize(ta);

        addTyping();
        await wait(450);
        removeTyping();

        demoReady(maybeDomain);
        return;
      }

      // normal message
      addMessage("user", escapeHtml(t));
      ta.value = "";
      autosize(ta);

      // count (uživatelský dotaz) – počítáme jen v DEMO
      const modeNow = getMode();
      if(modeNow === "demo"){
        const cnt = getUserCount() + 1;
        setUserCount(cnt);
      }

      // DEMO context → aby AI vždy věděla, pro jaký web to je + že je jen homepage
      const st = getDemoState();
      const demoContext = st?.domain ? `
[DEMO MODE]
Web: ${st.domain}
Firma: ${st.company}
Načtený obsah: pouze homepage webu
Pokyny:
- Odpovídej jako chatbot tohoto webu.
- Pokud informace není na homepage, řekni, že v DEMO ukázce nemusí být dostupná (protože je načtena jen homepage).
- Doporuč, kde by ji návštěvník našel (např. Kontakt, O nás, Služby, Ceník).
- Neptej se opakovaně na obor podnikání (žádný dotazník).
- Polož maximálně 1 doplňující otázku, jen pokud to opravdu pomůže.
` : `
[DEMO MODE]
Načtený obsah: pouze homepage (zatím nebyla zadána doména).
Pokyny:
- Vyzvi uživatele, ať zadá doménu webu (např. dachmantechnik.cz), aby šlo připravit demo.
`;

      // ✅ MODE header přidaný do zprávy
      const modeHeader = (modeNow === "sales") ? "[MODE: SALES]\n" : "[MODE: DEMO]\n";
      const payloadText =
        modeHeader +
        t +
        (modeNow === "demo" ? ("\n\n" + demoContext) : "");

      addTyping();
      sendBtn.disabled = true;

      try{
        const out = await callAssistant(payloadText);
        removeTyping();
        addMessage("bot", out.answer);
      }catch(e){
        removeTyping();
        addMessage("bot", `Omlouvám se, došlo k chybě. Zkuste to prosím znovu.`);
      }finally{
        sendBtn.disabled = false;
        scrollToBottom();

        // ✅ nudge jen v DEMO
        if(getMode() === "demo") maybeNudge();
      }
    }

    function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

    /******************************************************************
     *  FORM SUBMIT (LEAD)
     ******************************************************************/
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();

      // ✅ při odesílání leadu držíme SALES mód
      setMode("sales");

      const submitBtn = document.getElementById("leadSubmit");
      submitBtn.disabled = true;

      const fd = new FormData(form);
      const name = (fd.get("name") || "").toString().trim();
      const email = (fd.get("email") || "").toString().trim();
      const phone = (fd.get("phone") || "").toString().trim();
      const web = (fd.get("web") || "").toString().trim();
      const message = (fd.get("message") || "").toString().trim();

      if(!email){
        submitBtn.disabled = false;
        addMessage("bot", `<span class="pill">INFO</span>Ještě potřebuji doplnit váš e-mail, prosím.`);
        return;
      }

      try{
        const payload = { name, phone, email, message, web };
        const res = await fetch(ENDPOINT_LEAD, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(payload)
        });

        try{ await res.json(); } catch(_) {}

        hideModal();
        addMessage("bot", `<span class="pill">OK</span>Děkuji, mám vše: ${escapeHtml(name || "—")}, ${escapeHtml(phone || "—")}, ${escapeHtml(email)}.`);

      }catch(err){
        addMessage("bot", `<span class="pill">CHYBA</span>Nepodařilo se odeslat formulář. Zkuste to prosím znovu.`);
      }finally{
        submitBtn.disabled = false;
      }
    });

    /******************************************************************
     *  INPUT UX
     ******************************************************************/
    function autosize(textarea){
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
    }
    ta.addEventListener("input", ()=>autosize(ta));

    ta.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendBtn.click();
      }
    });

    sendBtn.addEventListener("click", ()=>{
      sendUserText(ta.value);
    });

    /******************************************************************
     *  INIT
     ******************************************************************/
    // ✅ default mód je DEMO (pokud ještě není nastaven)
    if(!localStorage.getItem(LS_MODE)) setMode("demo");

    intro();

    setTimeout(()=>{
      try{ ta.focus({ preventScroll:true }); }catch(e){ ta.focus(); }
    }, 200);

  </script>
</body>
</html>
