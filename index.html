<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sales chatbot – test</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;padding:20px;background:#f6f7f8}
    .wrap{max-width:900px;margin:0 auto}
    .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    h1{margin:0 0 6px;font-size:20px}
    .sub{font-size:13px;color:#666;margin-bottom:12px}
    .chat{min-height:420px;max-height:65vh;overflow:auto;border:1px solid #e5e5e5;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
    .msg{padding:10px 12px;border-radius:14px;white-space:pre-wrap;max-width:92%}
    .user{align-self:flex-end;background:#dff7e8}
    .bot{align-self:flex-start;background:#f1f3f5}
    .sys{align-self:flex-start;background:#fff7d6;border:1px dashed #e3c36a}
    .row{display:flex;gap:8px;margin-top:12px}
    input{flex:1;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px}
    button{padding:12px 14px;border-radius:12px;border:0;font-weight:700;cursor:pointer}
    .btn{background:#0b5;color:#fff}
    .btn2{background:#eee}
    .meta{margin-top:10px;font-size:12px;color:#555;display:flex;gap:10px;flex-wrap:wrap}
    .pill{background:#f0f0f0;padding:4px 8px;border-radius:999px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Sales chatbot – debug</h1>
    <div class="sub">
      ✔ drží paměť (thread_id) · ✔ sbírá kontakt ve frontendu (nezávisle na JSON) · ✔ ukáže odpověď ze Sheets
    </div>

    <div id="chat" class="chat"></div>

    <div class="row">
      <input id="input" placeholder="Napiš zprávu…" autocomplete="off">
      <button id="send" class="btn">Odeslat</button>
      <button id="reset" class="btn2">Nový chat</button>
    </div>

    <div class="meta">
      <span class="pill" id="threadInfo">thread_id: –</span>
      <span class="pill" id="status">stav: připraveno</span>
      <span class="pill" id="stepInfo">krok: –</span>
    </div>
  </div>
</div>

<script>
/* ================= PAMĚŤ THREADU ================= */
const THREAD_KEY = "sales_chatbot_thread_id";
const getThreadId = () => localStorage.getItem(THREAD_KEY) || "";
const setThreadId = id => id && localStorage.setItem(THREAD_KEY, id);
const resetThread = () => localStorage.removeItem(THREAD_KEY);

/* ================= LEAD STATE (frontend paměť) ================= */
const LEAD_KEY = "sales_chatbot_lead_state_v2";
const defaultLeadState = () => ({
  step: "obor",        // obor -> potreba -> name -> phone -> email -> done
  obor: "",
  potreba: "",
  name: "",
  phone: "",
  email: "",
  submitted: false,
});

function loadLeadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LEAD_KEY) || "null");
    if (!s || typeof s !== "object") return defaultLeadState();
    return { ...defaultLeadState(), ...s };
  } catch {
    return defaultLeadState();
  }
}

function saveLeadState() {
  localStorage.setItem(LEAD_KEY, JSON.stringify(leadState));
}

function resetLeadState() {
  leadState = defaultLeadState();
  localStorage.removeItem(LEAD_KEY);
  updateStepInfo();
}

let leadState = loadLeadState();

/* ================= UI ================= */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");
const threadInfo = document.getElementById("threadInfo");
const statusEl = document.getElementById("status");
const stepInfo = document.getElementById("stepInfo");

function setStatus(t){ statusEl.textContent = "stav: " + t; }
function updateThread(){ threadInfo.textContent = "thread_id: " + (getThreadId() || "–"); }
function updateStepInfo(){ stepInfo.textContent = "krok: " + (leadState.step || "–"); }

function add(role, text){
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : role === "sys" ? "sys" : "bot");
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

/* ================= HELPERS: extrakce phone/email + čištění textu ================= */
function extractEmail(text){
  const m = String(text).match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
  return m ? m[0] : "";
}

function extractPhone(text){
  const digits = String(text).replace(/[^\d]/g, "");
  if (digits.length >= 9) {
    if (digits.startsWith("420") && digits.length >= 12) return digits.slice(-9);
    return digits.slice(-9);
  }
  return "";
}

function stripEmailPhone(text, email, phone){
  let s = String(text);

  if (email) s = s.replace(email, " ");
  if (phone) {
    // odstraníme různé formáty telefonu (s mezerami)
    const p = phone.split("").join("\\s*");
    const re = new RegExp(p, "g");
    s = s.replace(re, " ");
  }

  // vyhoď nadbytečné znaky
  s = s.replace(/\s+/g, " ").trim();
  return s;
}

function looksLikeName(str){
  // jednoduchá heuristika: aspoň 2 slova, žádná @, málo číslic
  const s = String(str).trim();
  if (!s) return false;
  if (s.includes("@")) return false;
  if ((s.match(/\d/g) || []).length > 0) return false;
  const parts = s.split(" ").filter(Boolean);
  return parts.length >= 2 && s.length <= 60;
}

/* ================= LEAD → SHEETS ================= */
async function sendLead(lead){
  try{
    const r = await fetch("/.netlify/functions/lead",{
      method:"POST",
      headers:{ "content-type":"application/json" },
      body:JSON.stringify(lead)
    });
    const txt = await r.text();
    return { ok:r.ok, raw:txt };
  }catch(e){
    return { ok:false, raw:String(e) };
  }
}

/* ================= CHAT → BACKEND (OpenAI Assistants) ================= */
async function askBot(text){
  const r = await fetch("/.netlify/functions/search",{
    method:"POST",
    headers:{ "content-type":"application/json" },
    body:JSON.stringify({
      message:text,
      thread_id:getThreadId()
    })
  });
  const d = await r.json().catch(() => ({}));
  if(d.thread_id) setThreadId(d.thread_id);
  updateThread();
  if(!d.ok) throw (d.error || "search failed");
  return d.answer || "";
}

/* ================= CAPTURE: umí i „všechno v jedné zprávě“ ================= */
function captureFromUserMessage(userText){
  const t = String(userText).trim();
  if (!t) return;

  const email = extractEmail(t);
  const phone = extractPhone(t);
  const cleaned = stripEmailPhone(t, email, phone);

  if (email && !leadState.email) leadState.email = email;
  if (phone && !leadState.phone) leadState.phone = phone;

  // Pokud uživatel pošle "jméno telefon email" v jedné zprávě, tak cleaned bude jméno
  if (!leadState.name && looksLikeName(cleaned)) {
    leadState.name = cleaned;
  }

  // krokové vyplnění — teď už NEBLOKUJEME kvůli email/phone
  if (leadState.step === "obor") {
    if (!leadState.obor && cleaned && !looksLikeName(cleaned)) {
      leadState.obor = cleaned;
      leadState.step = "potreba";
    } else if (leadState.obor) {
      leadState.step = "potreba";
    }
  }

  if (leadState.step === "potreba") {
    if (!leadState.potreba && cleaned && !looksLikeName(cleaned)) {
      leadState.potreba = cleaned;
      leadState.step = "name";
    } else if (leadState.potreba) {
      leadState.step = "name";
    }
  }

  if (leadState.step === "name") {
    if (!leadState.name && cleaned) {
      leadState.name = cleaned;
    }
    if (leadState.name) leadState.step = "phone";
  }

  if (leadState.step === "phone") {
    if (leadState.phone) leadState.step = "email";
  }

  if (leadState.step === "email") {
    // email je volitelné; když je vyplněno nebo uživatel odpověděl, jdeme dál
    leadState.step = "done";
  }

  saveLeadState();
  updateStepInfo();
}

/* ================= SUBMIT: jakmile máme name + phone a ještě to neodešlo ================= */
async function maybeSubmitLead(){
  if (leadState.submitted) return;

  const name = String(leadState.name || "").trim();
  const phone = String(leadState.phone || "").trim();
  if (!name || !phone) return;

  const email = String(leadState.email || "").trim();
  const message = [
    leadState.obor ? `Obor: ${leadState.obor}` : "",
    leadState.potreba ? `Co řeší: ${leadState.potreba}` : ""
  ].filter(Boolean).join(" | ");

  const lead = { name, phone, email, message };

  add("sys", "📤 Odesílám do Sheets:\n" + JSON.stringify(lead, null, 2));
  setStatus("odesílám do Sheets…");

  const r = await sendLead(lead);
  if (r.ok) {
    leadState.submitted = true;
    saveLeadState();
    add("sys", "✅ Sheets odpověď:\n" + r.raw);
    setStatus("uloženo do Sheets");
  } else {
    add("sys", "❌ Chyba Sheets:\n" + r.raw);
    setStatus("chyba Sheets");
  }
}

/* ================= SEND ================= */
async function send(){
  const t = input.value.trim();
  if(!t) return;

  if(t.toLowerCase()==="reset"){
    resetThread();
    resetLeadState();
    chat.innerHTML="";
    updateThread();
    updateStepInfo();
    add("bot","Nový chat ✅ Pro jaký obor podnikání řešení hledáte?");
    return;
  }

  add("user",t);
  input.value="";
  setStatus("generuji…");
  sendBtn.disabled=true;

  try{
    captureFromUserMessage(t);

    const ans = await askBot(t);
    add("bot",ans);

    await maybeSubmitLead();

    if (!leadState.submitted) setStatus("připraveno");
  }catch(e){
    add("bot","❌ Chyba:\n"+e);
    setStatus("chyba");
  }finally{
    sendBtn.disabled=false;
    input.focus();
  }
}

/* ================= EVENTS ================= */
sendBtn.onclick = send;
input.addEventListener("keydown",e=>e.key==="Enter"&&send());
resetBtn.onclick = ()=>{
  resetThread();
  resetLeadState();
  chat.innerHTML="";
  updateThread();
  updateStepInfo();
  add("bot","Nový chat ✅ Pro jaký obor podnikání řešení hledáte?");
};

/* ================= INIT ================= */
updateThread();
updateStepInfo();
add("bot","Dobrý den 👋 Pro jaký obor podnikání řešení hledáte?");
</script>
</body>
</html>
