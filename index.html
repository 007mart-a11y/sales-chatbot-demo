<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chatbot widget demo</title>

  <!-- Embed flag: když je ?embed=1 nebo běží uvnitř iframe -->
  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      const isEmbed = qs.has("embed") || (window.self !== window.top);
      if (isEmbed) document.documentElement.classList.add("embed");
    })();
  </script>

  <style>
    :root{
      --bg:#06101f;
      --panel:#071a2f;
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);

      --cyan:#26d7ff;
      --cyan2:#00a8ff;

      --ok:#3ee07a;
      --shadow: 0 24px 70px rgba(0,0,0,.45);
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background: radial-gradient(1100px 520px at 20% 0%, rgba(38,215,255,.14), transparent 60%),
                  radial-gradient(900px 540px at 90% 40%, rgba(0,168,255,.12), transparent 60%),
                  var(--bg);
      color:var(--text);
    }

    /* =========================
       SIDE TAB (launcher) — JEDINÝ ovladač
       ========================= */
    .cb-sideTab{
      position:fixed;
      right:14px;
      top:45%;
      transform: translateY(-50%);
      z-index:99999;
      pointer-events:auto;

      display:flex;
      align-items:center;
      gap:10px;

      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(38,215,255,.22);
      background: linear-gradient(90deg, rgba(38,215,255,.14), rgba(0,168,255,.10));
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);

      cursor:pointer;
      user-select:none;

      max-width:min(360px, calc(100vw - 34px));
      animation: cbFloat 2.6s ease-in-out infinite;
    }
    @keyframes cbFloat{
      0%,100%{ transform: translateY(-50%) translateX(0) }
      50%{ transform: translateY(-50%) translateX(-4px) }
    }

    .cb-sideTab:before{
      content:"";
      position:absolute;
      inset:-6px;
      border-radius:999px;
      border:1px solid rgba(38,215,255,.18);
      opacity:.65;
      pointer-events:none;
      animation: cbGlow 2.2s ease-in-out infinite;
    }
    @keyframes cbGlow{
      0%,100%{ opacity:.35 }
      50%{ opacity:.85 }
    }

    .cb-sideIcon{
      width:34px;height:34px;
      border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(38,215,255,.26);
      background: radial-gradient(circle at 30% 30%, rgba(38,215,255,.92), rgba(0,168,255,.88));
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
      flex:0 0 auto;
    }
    .cb-sideText{
      display:flex;
      flex-direction:column;
      gap:2px;
      line-height:1.15;
      min-width:0;
    }
    .cb-sideText b{
      font-size:12.5px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .cb-sideText span{
      font-size:11.5px;
      color:rgba(255,255,255,.72);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .cb-sideArrow{
      margin-left:4px;
      width:22px;height:22px;border-radius:999px;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.18);
      flex:0 0 auto;
    }
    .cb-sideArrow svg{opacity:.9}

    /* =========================
       OVERLAY + PANEL
       ========================= */
    .cb-overlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(2px);
      z-index:99997;
      display:none;
    }
    .cb-overlay.open{display:block}

    .cb-panel{
      position:fixed;
      right:18px;
      bottom:18px;
      width:min(420px, calc(100vw - 36px));
      height:min(680px, calc(100vh - 36px));
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(7,26,47,.98), rgba(5,16,31,.98));
      box-shadow: var(--shadow);
      overflow:hidden;
      z-index:99998;
      display:none;
    }
    .cb-panel.open{display:block}

    .cb-body{
      display:flex;
      flex-direction:column;
      height:100%;
    }

    .cb-top{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding:10px 10px 0 10px;
      background: transparent;
    }
    .cb-close{
      width:34px;height:34px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:rgba(255,255,255,.85);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      user-select:none;
    }

    .cb-chat{
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:auto;
      flex:1;
      scroll-behavior:smooth;
      background: radial-gradient(700px 420px at 10% 0%, rgba(38,215,255,.08), transparent 62%);
    }

    .cb-msg{
      max-width:88%;
      padding:10px 12px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      white-space:pre-wrap;
      word-break:break-word;
      font-size:13.5px;
      line-height:1.35;
    }
    .cb-msg.bot{align-self:flex-start}
    .cb-msg.user{
      align-self:flex-end;
      background: rgba(38,215,255,.10);
      border-color: rgba(38,215,255,.18);
    }
    .cb-hint{
      max-width:88%;
      font-size:11.5px;
      color:rgba(255,255,255,.62);
      line-height:1.25;
    }

    .cb-card{
      max-width:88%;
      align-self:flex-start;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.14);
      border-radius:16px;
      padding:10px 12px;
    }
    .cb-card b{display:block;font-size:12.8px}
    .cb-card span{display:block;font-size:11.7px;color:rgba(255,255,255,.70);margin-top:3px;line-height:1.25}
    .cb-miniRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .cb-chip{
      border:1px solid rgba(38,215,255,.22);
      background: rgba(38,215,255,.10);
      color:rgba(255,255,255,.85);
      padding:7px 10px;
      border-radius:999px;
      font-size:11.5px;
      cursor:pointer;
      user-select:none;
    }
    .cb-chip.gray{
      border-color: rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
    }
    .cb-chip:hover{filter:brightness(1.08)}

    .cb-list{
      margin:8px 0 0 0;
      padding:0;
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .cb-li{
      display:flex;
      gap:10px;
      align-items:flex-start;
      font-size:12.5px;
      color:rgba(255,255,255,.72);
      line-height:1.25;
    }
    .cb-check{
      width:18px;height:18px;border-radius:8px;
      border:1px solid rgba(38,215,255,.25);
      background: rgba(38,215,255,.10);
      display:flex;align-items:center;justify-content:center;
      color: var(--ok);
      font-weight:900;
      flex:0 0 auto;
      margin-top:1px;
    }

    .cb-row{
      display:flex;
      gap:10px;
      padding:12px;
      border-top:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.16);
    }
    .cb-input{
      flex:1;
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
      font-size:14px;
    }
    .cb-input::placeholder{color:rgba(255,255,255,.45)}
    .cb-send{
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(38,215,255,.26);
      background: linear-gradient(90deg, rgba(38,215,255,.95), rgba(0,168,255,.90));
      color:#00131f;
      font-weight:900;
      cursor:pointer;
    }
    .cb-send:disabled{opacity:.6; cursor:not-allowed}

    /* ===== Lead modal ===== */
    .cb-modalWrap{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.55);
      z-index:100000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .cb-modalWrap.open{display:flex}
    .cb-modal{
      width:min(520px, 100%);
      border-radius:18px;
      border:1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(7,26,47,.98), rgba(5,16,31,.98));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .cb-modalTop{
      display:flex;
      gap:10px;
      align-items:center;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.12);
    }
    .cb-modalTop b{font-size:13.5px}
    .cb-modalTop span{display:block;font-size:11.5px;color:rgba(255,255,255,.70);margin-top:2px;line-height:1.25}
    .cb-modalClose{
      margin-left:auto;
      width:34px;height:34px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:rgba(255,255,255,.85);
      cursor:pointer;
      display:flex;align-items:center;justify-content:center;
    }
    .cb-form{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .cb-field{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .cb-label{font-size:11.5px;color:rgba(255,255,255,.70)}
    .cb-inp{
      padding:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color:var(--text);
      outline:none;
      font-size:14px;
    }
    .cb-inp::placeholder{color:rgba(255,255,255,.45)}
    .cb-textarea{min-height:84px; resize:vertical}
    .cb-formRow{
      display:flex;
      gap:10px;
      margin-top:4px;
      flex-wrap:wrap;
    }
    .cb-btn{
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(38,215,255,.26);
      background: linear-gradient(90deg, rgba(38,215,255,.95), rgba(0,168,255,.90));
      color:#00131f;
      font-weight:900;
      cursor:pointer;
      flex:1;
      min-width: 160px;
    }
    .cb-btn.gray{
      border-color: rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:rgba(255,255,255,.85);
      font-weight:800;
    }
    .cb-err{
      color: rgba(255,92,92,.95);
      font-size: 12px;
      display:none;
    }
    .cb-ok{
      color: rgba(62,224,122,.95);
      font-size: 12px;
      display:none;
    }

    @media (max-width: 520px){
      .cb-sideTab{
        right:10px;
        top:auto;
        bottom:90px;
        transform:none;
        max-width: calc(100vw - 20px);
        animation: none;
      }
      .cb-sideTab:before{display:none}
    }

    .cb-hidden{ display:none !important; }

    /* EMBED MODE: launcher pryč + chat otevřený hned (řeší JS) */
    html.embed .cb-sideTab{ display:none !important; }
  </style>
</head>

<body>

  <!-- SIDE TAB (launcher) -->
  <div class="cb-sideTab" id="cbSideTab" aria-label="Otevřít demo chatbota">
    <div class="cb-sideIcon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M9 3h6" stroke="#00131f" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 3v3" stroke="#00131f" stroke-width="2" stroke-linecap="round"/>
        <rect x="5" y="7" width="14" height="12" rx="4" stroke="#00131f" stroke-width="2"/>
        <path d="M9 12h.01M15 12h.01" stroke="#00131f" stroke-width="3" stroke-linecap="round"/>
        <path d="M8.5 16c1 .8 2.3 1.2 3.5 1.2s2.5-.4 3.5-1.2" stroke="#00131f" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="cb-sideText">
      <b>Vyzkoušejte demo chatbota</b>
      <span>pro vaši firmu • klikněte zde</span>
    </div>
    <div class="cb-sideArrow" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M9 18l6-6-6-6" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- overlay -->
  <div class="cb-overlay" id="cbOverlay" aria-hidden="true"></div>

  <!-- Widget panel -->
  <div class="cb-panel" id="cbPanel" role="dialog" aria-label="Chatbot widget">
    <div class="cb-body">
      <div class="cb-top">
        <button class="cb-close" id="cbClose" aria-label="Zavřít">✕</button>
      </div>

      <div class="cb-chat" id="cbChat"></div>

      <div class="cb-row">
        <input class="cb-input" id="cbInput" placeholder="Napište dotaz…" autocomplete="off" />
        <button class="cb-send" id="cbSend">Odeslat</button>
      </div>
    </div>
  </div>

  <!-- Lead modal -->
  <div class="cb-modalWrap" id="cbModalWrap" role="dialog" aria-label="Kontaktní formulář">
    <div class="cb-modal">
      <div class="cb-modalTop">
        <div>
          <b>Chcete plnou verzi chatbota?</b>
          <span>Vyplňte prosím kontakt. Ozveme se vám a navrhneme řešení na míru.</span>
        </div>
        <button class="cb-modalClose" id="cbModalClose" aria-label="Zavřít">✕</button>
      </div>

      <form class="cb-form" id="cbLeadForm">
        <div class="cb-field">
          <div class="cb-label">Jméno a příjmení</div>
          <input class="cb-inp" id="leadName" placeholder="Např. Jan Novák" />
        </div>

        <div class="cb-field">
          <div class="cb-label">Telefon</div>
          <input class="cb-inp" id="leadPhone" placeholder="Např. 777 123 456" />
        </div>

        <div class="cb-field">
          <div class="cb-label">E-mail</div>
          <input class="cb-inp" id="leadEmail" placeholder="Např. jan@firma.cz" />
        </div>

        <div class="cb-field">
          <div class="cb-label">Požadavek</div>
          <textarea class="cb-inp cb-textarea" id="leadNote" placeholder="Např. chatbot na web, FAQ + sběr poptávek…"></textarea>
        </div>

        <div class="cb-err" id="leadErr">Prosím zkontrolujte vyplněné údaje.</div>
        <div class="cb-ok" id="leadOk">Děkujeme, máme vše. Ozveme se co nejdříve.</div>

        <div class="cb-formRow">
          <button type="button" class="cb-btn gray" id="cbLeadCancel">Zrušit</button>
          <button type="submit" class="cb-btn" id="cbLeadSubmit">Odeslat</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ====== KONFIG (pevně na tvou Netlify app) ======
    const APP_ORIGIN = "https://sales-chatbot-demo.netlify.app";
    const ENDPOINT_DEMO   = `${APP_ORIGIN}/.netlify/functions/search-demo`;
    const ENDPOINT_SCRAPE = `${APP_ORIGIN}/.netlify/functions/scrape`;
    const ENDPOINT_LEAD   = `${APP_ORIGIN}/.netlify/functions/lead`;

    const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
    const isEmbed = document.documentElement.classList.contains("embed");

    // ====== storage keys ======
    const THREAD_KEY = "demo_widget_thread_id_v2";
    const CONTEXT_KEY = "demo_widget_context_v2";
    const STATE_KEY = "demo_widget_state_v2";
    const CTA_KEY = "demo_widget_cta_shown_v2";

    // ====== state ======
    const defaultState = () => ({
      companyName: "",
      siteUrl: "",
      demoTurns: 0,
      demoPreviewShown: false
    });

    let state = loadState();

    function loadState(){
      try{
        const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
        if(!s || typeof s !== "object") return defaultState();
        return { ...defaultState(), ...s };
      }catch{
        return defaultState();
      }
    }
    function saveState(){ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

    const getThreadId = () => localStorage.getItem(THREAD_KEY) || "";
    const setThreadId = (id) => id && localStorage.setItem(THREAD_KEY, id);
    const resetThreadId = () => localStorage.removeItem(THREAD_KEY);

    const getContext = () => localStorage.getItem(CONTEXT_KEY) || "";
    const setContext = (t) => localStorage.setItem(CONTEXT_KEY, t || "");

    // ====== DOM ======
    const cbPanel   = document.getElementById("cbPanel");
    const cbOverlay = document.getElementById("cbOverlay");
    const cbChat    = document.getElementById("cbChat");
    const cbInput   = document.getElementById("cbInput");
    const cbSend    = document.getElementById("cbSend");
    const cbClose   = document.getElementById("cbClose");
    const cbSideTab = document.getElementById("cbSideTab");

    // ====== UI helpers ======
    function openPanel(){
      // launcher musí po otevření zmizet a nikdy se neukazovat uvnitř chatu
      if(cbSideTab) cbSideTab.classList.add("cb-hidden");

      cbPanel.classList.add("open");
      cbOverlay.classList.add("open");

      if(!cbChat.dataset.inited){
        cbChat.dataset.inited = "1";
        renderWelcome();
      }

      // rovnou možnost psát
      setTimeout(() => cbInput && cbInput.focus(), 30);
    }

    function closePanel(){
      cbPanel.classList.remove("open");
      cbOverlay.classList.remove("open");

      // v embed režimu launcher nikdy neukazuj
      if(!isEmbed && cbSideTab) cbSideTab.classList.remove("cb-hidden");
    }

    // Bind open/close (jen pokud launcher existuje)
    if(cbSideTab) cbSideTab.addEventListener("click", openPanel);
    cbClose.addEventListener("click", closePanel);
    cbOverlay.addEventListener("click", closePanel);
    document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closePanel(); });

    function scrollBottom(){
      requestAnimationFrame(()=>{ cbChat.scrollTop = cbChat.scrollHeight; });
      setTimeout(()=>{ cbChat.scrollTop = cbChat.scrollHeight; }, 40);
    }

    function addMsg(role, textOrHtml, asHtml=false){
      const d = document.createElement("div");
      d.className = "cb-msg " + (role === "user" ? "user" : "bot");
      if(asHtml) d.innerHTML = textOrHtml;
      else d.textContent = textOrHtml;
      cbChat.appendChild(d);
      scrollBottom();
    }

    function addHint(text){
      const d = document.createElement("div");
      d.className = "cb-hint";
      d.textContent = text;
      cbChat.appendChild(d);
      scrollBottom();
    }

    function escapeHtml(str){
      return String(str||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function prettyDomain(url){
      return String(url||"").replace(/^https?:\/\//i,"").replace(/\/+$/,"");
    }

    function titleizeFromDomain(domain){
      const d = String(domain||"").replace(/^www\./i,"");
      const base = d.split(".")[0] || "";
      if(!base) return "";
      return base
        .split(/[-_]+/g)
        .filter(Boolean)
        .map(w => (w.length<=2 ? w.toUpperCase() : (w[0].toUpperCase()+w.slice(1))))
        .join(" ");
    }

    function looksValidUrl(u){
      const s = String(u||"").trim();
      return !!(s && s.length>=6 && !/\s/.test(s) && s.includes("."));
    }

    function normalizeUrl(u){
      let s = String(u||"").trim().replace(/\s+/g,"");
      if(!s) return "";
      if(!/^https?:\/\//i.test(s)) s = "https://" + s;
      try{
        const url = new URL(s);
        return url.origin;
      }catch{
        return s;
      }
    }

    // ====== Demo preview (compact) ======
    function renderCompactPreview(){
      const domain = prettyDomain(state.siteUrl || "");
      const company = (state.companyName || "").trim() || titleizeFromDomain(domain) || "vaši firmu";

      const html = `
        <div class="cb-card">
          <b>Ukázka pro firmu: ${escapeHtml(company)}</b>
          <span>${domain ? ("Web: " + escapeHtml(domain) + " • ") : ""}Zeptejte se jako zákazník (cena, termín, postup, služby).</span>

          <ul class="cb-list">
            <li class="cb-li"><span class="cb-check">✓</span><span>Odpoví na časté dotazy a zkrátí čas na telefonu</span></li>
            <li class="cb-li"><span class="cb-check">✓</span><span>Navede zákazníka na správnou službu / kontakt</span></li>
            <li class="cb-li"><span class="cb-check">✓</span><span>Sběr poptávek 24/7 (plná verze)</span></li>
          </ul>

          <div class="cb-miniRow">
            <span class="cb-chip" data-action="examples">Ukázat 3 příklady odpovědí</span>
            <span class="cb-chip gray" data-action="lead">Chci plnou verzi</span>
          </div>
        </div>
      `;
      addMsg("bot", html, true);

      const last = cbChat.lastElementChild;
      last.querySelectorAll("[data-action]").forEach(el=>{
        el.addEventListener("click", ()=>{
          const a = el.dataset.action;
          if(a === "examples"){
            addMsg("bot",
`Příklady dotazů:
1) „Kolik to stojí?“
2) „Jaký je postup a jak dlouho to trvá?“
3) „Kdy můžete přijet / jak rychle to umíte?“`
            );
          }
          if(a === "lead"){
            openLeadModal();
          }
        });
      });

      state.demoPreviewShown = true;
      saveState();
    }

    function maybeShowCta(){
      if(localStorage.getItem(CTA_KEY) === "1") return;
      if(state.demoTurns >= 2){
        localStorage.setItem(CTA_KEY, "1");

        const html = `
          <div class="cb-card" style="border-color:rgba(38,215,255,.18);background:linear-gradient(90deg, rgba(38,215,255,.10), rgba(0,168,255,.06));">
            <b>Chcete plnou verzi chatbota pro váš web?</b>
            <span>Vyplňte kontakt a my vám pošleme konkrétní návrh použití pro váš typ zákazníků.</span>
            <div class="cb-miniRow">
              <span class="cb-chip" data-action="lead">Otevřít formulář</span>
              <span class="cb-chip gray" data-action="later">Později</span>
            </div>
          </div>
        `;
        addMsg("bot", html, true);

        const last = cbChat.lastElementChild;
        last.querySelectorAll("[data-action]").forEach(el=>{
          el.addEventListener("click", ()=>{
            const a = el.dataset.action;
            if(a==="lead") openLeadModal();
          });
        });
      }
    }

    // ====== Lead modal ======
    const cbModalWrap = document.getElementById("cbModalWrap");
    const cbModalClose = document.getElementById("cbModalClose");
    const cbLeadCancel = document.getElementById("cbLeadCancel");
    const cbLeadForm = document.getElementById("cbLeadForm");
    const leadName = document.getElementById("leadName");
    const leadPhone = document.getElementById("leadPhone");
    const leadEmail = document.getElementById("leadEmail");
    const leadNote = document.getElementById("leadNote");
    const leadErr = document.getElementById("leadErr");
    const leadOk = document.getElementById("leadOk");
    const cbLeadSubmit = document.getElementById("cbLeadSubmit");

    function openLeadModal(){
      leadErr.style.display = "none";
      leadOk.style.display = "none";
      cbModalWrap.classList.add("open");
      leadName.focus();
    }
    function closeLeadModal(){ cbModalWrap.classList.remove("open"); }
    cbModalClose.addEventListener("click", closeLeadModal);
    cbLeadCancel.addEventListener("click", closeLeadModal);
    cbModalWrap.addEventListener("click", (e)=>{ if(e.target===cbModalWrap) closeLeadModal(); });

    function isValidEmail(s){
      return /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(String(s||""));
    }
    function onlyDigits(s){ return String(s||"").replace(/\D+/g,""); }

    async function sendLead(payload){
      const r = await fetch(ENDPOINT_LEAD,{
        method:"POST",
        headers:{ "content-type":"application/json" },
        body: JSON.stringify(payload)
      });
      const txt = await r.text();
      return { ok: r.ok, raw: txt };
    }

    cbLeadForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      leadErr.style.display = "none";
      leadOk.style.display = "none";

      const name = leadName.value.trim();
      const phone = onlyDigits(leadPhone.value.trim());
      const email = leadEmail.value.trim();
      const note = leadNote.value.trim();

      const missing = [];
      if(!name) missing.push("jméno");
      if(!phone || phone.length < 9) missing.push("telefon");
      if(!email || !isValidEmail(email)) missing.push("e-mail");

      if(missing.length){
        leadErr.textContent = "Prosím doplňte: " + missing.join(", ") + ".";
        leadErr.style.display = "block";
        return;
      }

      cbLeadSubmit.disabled = true;
      cbLeadSubmit.textContent = "Odesílám…";

      try{
        const company = (state.companyName || "").trim() || titleizeFromDomain(prettyDomain(state.siteUrl||"")) || "";
        const url = state.siteUrl || "";

        const payload = {
          name,
          phone,
          email,
          message: `Zájem o plnou verzi | Firma: ${company} | Web: ${url} | Požadavek: ${note || "—"}`
        };

        const resp = await sendLead(payload);
        if(!resp.ok){
          if(DEBUG) console.log(resp.raw);
          leadErr.textContent = "Omlouváme se, nepodařilo se to odeslat. Zkuste to prosím znovu.";
          leadErr.style.display = "block";
          return;
        }

        leadOk.style.display = "block";
        setTimeout(()=>{
          closeLeadModal();
          addMsg("bot", "Děkujeme. ✅ Ozveme se co nejdříve a navrhneme řešení na míru.");
        }, 650);

      } finally {
        cbLeadSubmit.disabled = false;
        cbLeadSubmit.textContent = "Odeslat";
      }
    });

    // ====== Backends ======
    async function scrapeHomepage(url){
      const r = await fetch(ENDPOINT_SCRAPE,{
        method:"POST",
        headers:{ "content-type":"application/json" },
        body: JSON.stringify({ url })
      });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || "Scrape failed");
      const text = String(d.text || d.content || d.body || "");
      if(!text) throw new Error("Scrape returned empty text");
      return text;
    }

    async function askDemoAI(message){
      const r = await fetch(ENDPOINT_DEMO,{
        method:"POST",
        headers:{ "content-type":"application/json" },
        body: JSON.stringify({
          message,
          thread_id: getThreadId(),
          context: getContext(),
          site_url: state.siteUrl || ""
        })
      });
      const d = await r.json().catch(()=>({}));
      if(d.thread_id) setThreadId(d.thread_id);
      if(!d.ok) throw new Error(d.error || "search-demo failed");
      return d.answer || "";
    }

    // ====== Flow ======
    function renderWelcome(){
      addMsg("bot","Dobrý den 👋");
      addHint("Toto je rychlá ukázka. Zadejte web (doménu) a vyzkoušejte odpovědi jako zákazník.");

      const html = `
        <div class="cb-card">
          <b>Chcete ukázku pro váš web?</b>
          <span>Napište doménu (např. <b>dachmantechnik.cz</b>) a připravím demo odpovědí.</span>
          <div class="cb-miniRow">
            <span class="cb-chip" data-action="how">Co demo umí</span>
            <span class="cb-chip gray" data-action="lead">Chci plnou verzi</span>
          </div>
        </div>
      `;
      addMsg("bot", html, true);

      const last = cbChat.lastElementChild;
      last.querySelectorAll("[data-action]").forEach(el=>{
        el.addEventListener("click", ()=>{
          const a = el.dataset.action;
          if(a==="how"){
            addMsg("bot","Demo ukazuje styl odpovědí a práci s obsahem webu. V plné verzi navíc sbírá poptávky (formulář), kvalifikuje zájemce a umí posílat data do e-mailu/CRM/Sheets.");
          }
          if(a==="lead"){
            openLeadModal();
          }
        });
      });
    }

    async function handleUserMessage(text){
      if(text.toLowerCase() === "reset"){
        resetThreadId();
        localStorage.removeItem(CONTEXT_KEY);
        localStorage.removeItem(STATE_KEY);
        localStorage.removeItem(CTA_KEY);
        state = defaultState();
        cbChat.innerHTML = "";
        cbChat.dataset.inited = "";
        renderWelcome();
        return;
      }

      // first time url/domain -> scrape
      if(!state.siteUrl && looksValidUrl(text)){
        const url = normalizeUrl(text);
        state.siteUrl = url;
        if(!state.companyName) state.companyName = titleizeFromDomain(prettyDomain(url));
        saveState();

        addMsg("bot","Děkuji — připravuji ukázku…");

        try{
          const ctx = await scrapeHomepage(url);
          setContext(ctx);
          addMsg("bot","Hotovo ✅ Ukázka je připravená. Zeptejte se jako zákazník.");
          if(!state.demoPreviewShown) renderCompactPreview();
        }catch(e){
          setContext("");
          if(DEBUG) console.log(e);
          addMsg("bot","Tento web nedovolil automatické načtení obsahu. Nevadí — i tak se můžete ptát, demo odpoví obecně.");
          if(!state.demoPreviewShown) renderCompactPreview();
        }
        return;
      }

      const ans = await askDemoAI(text);
      addMsg("bot", ans);

      state.demoTurns = (state.demoTurns || 0) + 1;
      saveState();
      maybeShowCta();
    }

    // ====== Send ======
    let sending = false;
    async function send(){
      const t = cbInput.value.trim();
      if(!t || sending) return;
      cbInput.value = "";
      addMsg("user", t);
      cbSend.disabled = true;
      sending = true;

      try{
        await handleUserMessage(t);
      }catch(err){
        if(DEBUG) console.log(err);
        addMsg("bot","Omlouváme se, něco se nepovedlo. Zkuste to prosím znovu.");
      }finally{
        cbSend.disabled = false;
        sending = false;
        cbInput.focus();
      }
    }

    cbSend.addEventListener("click", send);
    cbInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter") send(); });

    // ====== INIT ======
    (function init(){
      // 1) Embed: otevři hned a focus
      if(isEmbed){
        openPanel();
        return;
      }
      // 2) Normal: nic se neotevře samo. Otevře až klik na lištu.
    })();
  </script>

</body>
</html>
