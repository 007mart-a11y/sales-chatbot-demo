<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sales Chatbot Demo</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    input { padding:10px; min-width: 320px; }
    button { padding:10px 14px; cursor:pointer; }
    .box { border:1px solid #ddd; border-radius:10px; padding:12px; margin-top:14px; }
    .muted { opacity:.7; }
    .msg { padding:8px 10px; border-radius:10px; margin:6px 0; max-width: 900px; white-space: pre-wrap; }
    .me { background:#eef; }
    .ai { background:#efe; }
    .err { background:#fee; }
  </style>
</head>
<body>

  <h2>DEMO ukázka pro web</h2>

  <div class="row">
    <input id="url" placeholder="Zadejte URL (např. https://www.dachmantechnik.cz)" />
    <button onclick="createDemo()">Vytvořit demo</button>
    <button onclick="resetAll()">Reset</button>
  </div>

  <div id="status" class="box muted">Zadejte URL a klikněte na „Vytvořit demo“.</div>

  <div class="box">
    <div class="row">
      <strong>Režim:</strong>
      <button onclick="setMode('demo')">DEMO</button>
      <button onclick="setMode('main')">HLAVNÍ</button>
      <span id="modeLabel" class="muted"></span>
    </div>
  </div>

  <div class="box" id="banner" style="display:none;"></div>

  <div class="box">
    <div id="chat"></div>
    <div class="row" style="margin-top:10px;">
      <input id="msg" placeholder="Napište dotaz..." />
      <button onclick="sendChat()">Odeslat</button>
    </div>
  </div>

<script>
  let mode = "demo";
  let threadIdDemo = null;
  let threadIdMain = null;

  let siteContext = "";
  let companyName = "";

  function el(id){ return document.getElementById(id); }

  function setMode(m){
    mode = m;
    el("modeLabel").textContent = mode === "demo" ? " (DEMO – odpovědi podle obsahu webu)" : " (HLAVNÍ – sales režim)";
    addSystem(mode === "demo" ? "Přepnuto na DEMO asistenta." : "Přepnuto na HLAVNÍHO asistenta.");
  }

  function addMsg(text, cls="ai"){
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    el("chat").appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function addSystem(text){ addMsg(text, "ai"); }
  function addError(text){ addMsg(text, "err"); }

  function resetAll(){
    threadIdDemo = null;
    threadIdMain = null;
    siteContext = "";
    companyName = "";
    el("chat").innerHTML = "";
    el("banner").style.display = "none";
    el("status").textContent = "Reset hotový. Zadejte URL a klikněte na „Vytvořit demo“.";
  }

  async function createDemo(){
    const url = el("url").value.trim();
    if(!url){ alert("Zadejte URL"); return; }

    el("status").textContent = "Připravuji pro vaši firmu AI chatbota na ukázku… načítám obsah webu.";
    el("banner").style.display = "none";
    siteContext = "";
    companyName = "";
    threadIdDemo = null; // nový demo thread

    try{
      const r = await fetch("/.netlify/functions/siteinfo", {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ url })
      });
      const j = await r.json();
      if(!j.ok) throw new Error(j.error + (j.details ? " | " + j.details : ""));

      companyName = j.companyName || "Vaše firma";
      siteContext = j.summary || "";

      // Banner, který chceš (krátký, jasný)
      el("banner").style.display = "block";
      el("banner").textContent =
        `Dobrý den, jsem AI asistent firmy ${companyName}.\n` +
        `Ptejte se mě jako typický zákazník.\n` +
        `Pozn.: Je to DEMO – plná verze umí znát detaily (služby, ceník, termíny) a dá se vyladit na míru.`;

      el("status").textContent = "Hotovo. Můžete se ptát – DEMO odpovědi budou vycházet z obsahu webu.";
      setMode("demo");

    } catch(e){
      el("status").textContent = "Nepodařilo se načíst web. Zkuste jinou URL nebo pošlete web, který selhal.";
      addError("Chyba při načtení webu: " + e.message);
    }
  }

  async function sendChat(){
    const text = el("msg").value.trim();
    if(!text) return;
    el("msg").value = "";
    addMsg(text, "me");

    // v DEMO režimu vyžadujeme siteContext
    if(mode === "demo" && !siteContext){
      addError("Nejdřív klikněte na „Vytvořit demo“ a načtěte web.");
      return;
    }

    const thread_id = mode === "demo" ? threadIdDemo : threadIdMain;

    try{
      const r = await fetch("/.netlify/functions/search", {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({
          message: text,
          thread_id,
          mode,
          site_context: mode === "demo" ? siteContext : undefined
        })
      });
      const j = await r.json();
      if(!j.ok) throw new Error(j.error + (j.details ? " | " + j.details : ""));

      if(mode === "demo") threadIdDemo = j.thread_id;
      else threadIdMain = j.thread_id;

      addMsg(j.answer || "…", "ai");
    } catch(e){
      addError("Chyba: " + e.message);
    }
  }

  // init
  setMode("demo");
</script>

</body>
</html>
