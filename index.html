<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI chatbot – ukázka</title>
  <style>
    :root{
      --bg:#0b0f19;
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --accent:#ff4fd8;
      --accent2:#9b5cff;
      --ok:#3ee07a;
      --warn:#ffcc66;
      --danger:#ff5c5c;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(255,79,216,.18), transparent 60%),
                  radial-gradient(900px 500px at 90% 30%, rgba(155,92,255,.18), transparent 60%),
                  var(--bg);
      color:var(--text);
      display:flex;align-items:center;justify-content:center;
      padding:18px;
    }
    .wrap{width:min(560px, 100%)}
    .widget{
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(18,24,39,.96), rgba(10,14,24,.96));
      border-radius:18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .top{
      display:flex;gap:12px;align-items:center;
      padding:14px 14px 10px 14px;
      border-bottom:1px solid var(--stroke);
    }
    .logo{
      width:34px;height:34px;border-radius:12px;
      background: radial-gradient(circle at 30% 30%, rgba(255,79,216,.95), rgba(155,92,255,.95));
      display:flex;align-items:center;justify-content:center;
      font-weight:800;
      box-shadow: 0 10px 30px rgba(255,79,216,.18);
      flex:0 0 auto;
    }
    .title{line-height:1.05}
    .title b{display:block;font-size:14px}
    .title span{display:block;font-size:12px;color:var(--muted)}
    .badge{
      margin-left:auto;
      font-size:11px;color:var(--muted);
      border:1px solid var(--stroke);
      padding:6px 10px;border-radius:999px;
      background: rgba(255,255,255,.04);
      white-space:nowrap;
    }

    .chat{
      padding:12px;
      display:flex;flex-direction:column;gap:10px;
      max-height:64vh; overflow:auto;
      scroll-behavior:smooth;
    }

    /* ✅ ONE compact banner in chat (NOT sticky, NOT overlay) */
    .contextBanner{
      border:1px solid rgba(255,79,216,.28);
      background: linear-gradient(90deg, rgba(255,79,216,.14), rgba(155,92,255,.10));
      border-radius:14px;
      padding:10px 12px;
    }
    .contextBanner b{font-size:12.5px; display:block}
    .contextBanner span{font-size:12px; color:rgba(255,255,255,.72); display:block; margin-top:2px}

    .msg{
      max-width:92%;
      padding:10px 12px;
      border-radius:16px;
      border:1px solid var(--stroke);
      white-space:pre-wrap;
      word-break:break-word;
      background: rgba(255,255,255,.04);
    }
    .bot{align-self:flex-start}
    .user{align-self:flex-end;background: rgba(62,224,122,.10); border-color: rgba(62,224,122,.20)}
    .hint{color:var(--muted); font-size:12px}
    .tiny{color:rgba(255,255,255,.55); font-size:11px}

    /* ✅ smaller, 2 tiles only */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
    .tile{
      border:1px solid rgba(255,79,216,.28);
      background: linear-gradient(180deg, rgba(255,79,216,.08), rgba(155,92,255,.05));
      border-radius:16px;padding:10px;cursor:pointer;user-select:none;
      transition: transform .08s ease, filter .08s ease;
      min-height:56px; /* smaller */
    }
    .tile:hover{transform:translateY(-1px); filter:brightness(1.06)}
    .tile .k{display:flex; align-items:center; gap:10px; margin-bottom:0}
    .ico{
      width:30px;height:30px;border-radius:12px;
      background: rgba(255,79,216,.16);
      border:1px solid rgba(255,79,216,.22);
      display:flex;align-items:center;justify-content:center;
      font-weight:800;
      flex:0 0 auto;
    }
    .tile b{font-size:13px}
    .tile span{display:block; font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.1}

    .list{margin:6px 0 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
    .list li{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13px}
    .check{
      width:18px;height:18px;border-radius:7px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.05);
      display:flex;align-items:center;justify-content:center;
      color: var(--ok);font-weight:900;flex:0 0 auto;margin-top:1px;
    }

    .demoCard{border:1px solid rgba(255,255,255,.12);background: rgba(255,255,255,.04);border-radius:16px;padding:12px}
    .demoTitle{font-weight:800;margin:0 0 8px 0;font-size:13px}
    .demoSub{color:var(--muted);font-size:12px;margin:0 0 10px 0}
    .demoBox{border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px;background: rgba(0,0,0,.14);margin-top:10px}
    .demoBox b{display:block;font-size:12px;margin-bottom:6px}
    .miniActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{
      border:1px solid rgba(255,79,216,.35);
      background: rgba(255,79,216,.10);
      padding:7px 10px;border-radius:999px;font-size:12px;cursor:pointer;user-select:none;
    }
    .chip:hover{filter:brightness(1.08)}
    .chip.alt{
      border-color: rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
    }

    .row{display:flex;gap:10px;padding:12px;border-top:1px solid var(--stroke);background: rgba(0,0,0,.12)}
    input{
      flex:1;padding:12px;border-radius:14px;border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);color: var(--text);outline:none;font-size:14px
    }
    input::placeholder{color:rgba(255,255,255,.45)}
    button{
      padding:12px 14px;border-radius:14px;border:1px solid rgba(255,79,216,.35);
      background: linear-gradient(90deg, rgba(255,79,216,.95), rgba(155,92,255,.95));
      color:#fff;font-weight:800;cursor:pointer
    }
    button:disabled{opacity:.6; cursor:not-allowed}
    .foot{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px 12px;color:rgba(255,255,255,.55);font-size:11px}
    .pill{border:1px solid var(--stroke);padding:6px 10px;border-radius:999px;background: rgba(255,255,255,.04)}
  </style>
</head>
<body>

<div class="wrap">
  <div class="widget">
    <div class="top">
      <div class="logo">AI</div>
      <div class="title">
        <b id="topTitle">AI Chatbot</b>
        <span id="topSub">Ukázka zdarma • rychlé vyzkoušení</span>
      </div>
      <div class="badge" id="modeBadge">MENU</div>
    </div>

    <div id="chat" class="chat"></div>

    <div class="row">
      <input id="input" placeholder="Napište zprávu…" autocomplete="off">
      <button id="send">Odeslat</button>
    </div>

    <div class="foot">
      <span class="pill" id="status">připraveno</span>
      <span class="pill">powered by demo</span>
    </div>
  </div>
</div>

<script>
const DEBUG = new URLSearchParams(location.search).get("debug") === "1";

/* THREAD */
const THREAD_KEY_DEMO = "demo_chatbot_thread_id";
const getThreadId = () => localStorage.getItem(THREAD_KEY_DEMO) || "";
const setThreadId = id => id && localStorage.setItem(THREAD_KEY_DEMO, id);
const resetThread = () => localStorage.removeItem(THREAD_KEY_DEMO);

/* STATE */
const STATE_KEY = "sales_demo_state_v4";
const CONTEXT_KEY = "sales_demo_homepage_context_v1";

const defaultState = () => ({
  mode: "menu",       // menu | url | seed | chat
  url: "",
  urlSaved: false,
  demoShown: false,
  contextReady: false,
  companyName: "",
  seedQuestions: []   // fallback questions when scrape blocked
});
let state = loadState();

function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if(!s || typeof s !== "object") return defaultState();
    return { ...defaultState(), ...s };
  }catch{ return defaultState(); }
}
function saveState(){ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
function resetState(){
  state = defaultState();
  localStorage.removeItem(STATE_KEY);
  localStorage.removeItem(CONTEXT_KEY);
  setMode("menu");
}

/* UI */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
const modeBadge = document.getElementById("modeBadge");
const topTitle = document.getElementById("topTitle");
const topSub = document.getElementById("topSub");

function setStatus(t){ statusEl.textContent = t; }

function setMode(m){
  state.mode = m; saveState();
  modeBadge.textContent = (m==="menu") ? "MENU" : (m==="url") ? "URL" : (m==="seed") ? "DEMO" : "CHAT";

  if(m==="url"){
    input.placeholder = "Zadejte web (např. muj-web.cz)";
  }else if(m==="seed"){
    input.placeholder = "Jméno firmy + 3 dotazy (viz příklad)…";
  }else{
    input.placeholder = "Napište zprávu…";
  }

  refreshTopBar();
  ensureContextBanner();
}

function refreshTopBar(){
  const name = (state.companyName || "").trim();
  if(name){
    topTitle.textContent = `AI Asistent – ${name}`;
    topSub.textContent = "DEMO ukázka • odpovědi podle vašeho webu / zadání";
  }else{
    topTitle.textContent = "AI Chatbot";
    topSub.textContent = "Ukázka zdarma • rychlé vyzkoušení";
  }
}

function scrollBottom(){
  requestAnimationFrame(()=>{ chat.scrollTop = chat.scrollHeight; });
  setTimeout(()=>{ chat.scrollTop = chat.scrollHeight; }, 60);
}

function add(role, htmlOrText, asHtml=false){
  const d = document.createElement("div");
  d.className = "msg " + (role==="user" ? "user" : "bot");
  if(asHtml) d.innerHTML = htmlOrText;
  else d.textContent = htmlOrText;
  chat.appendChild(d);
  scrollBottom();
}
function addHint(text){
  const p = document.createElement("div");
  p.className = "hint";
  p.textContent = text;
  chat.appendChild(p);
  scrollBottom();
}
function addTiny(text){
  const p = document.createElement("div");
  p.className = "tiny";
  p.textContent = text;
  chat.appendChild(p);
  scrollBottom();
}

/* ✅ one banner in chat – no sticky, no overlay */
function ensureContextBanner(){
  const existing = document.getElementById("contextBanner");
  const name = (state.companyName || "").trim();

  if(!name){
    if(existing) existing.remove();
    return;
  }

  if(existing) {
    existing.querySelector("b").textContent = `Chatbot ukázka pro firmu ${name}`;
    existing.querySelector("span").textContent = "Teď se můžete ptát – ukázka odpovědí podle vašeho webu / zadání.";
    return;
  }

  const b = document.createElement("div");
  b.className = "contextBanner";
  b.id = "contextBanner";
  b.innerHTML = `<b>Chatbot ukázka pro firmu ${escapeHtml(name)}</b>
                 <span>Teď se můžete ptát – ukázka odpovědí podle vašeho webu / zadání.</span>`;
  // put at top of chat flow
  chat.prepend(b);
}

/* HELPERS */
function escapeHtml(str){
  return String(str||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

function normalizeUrl(u){
  let s = String(u||"").trim().replace(/\s+/g,"");
  if(!s) return "";
  if(!/^https?:\/\//i.test(s)) s = "https://" + s;
  // keep only origin (more stable)
  try{
    const url = new URL(s);
    return url.origin;
  }catch{
    return s;
  }
}
function looksValidUrl(u){
  const s = String(u||"").trim();
  return !!(s && s.length>=6 && !/\s/.test(s) && s.includes("."));
}
function prettyDomain(url){
  return String(url).replace(/^https?:\/\//i,"").replace(/\/+$/,"");
}
function titleizeFromDomain(domain){
  const d = String(domain||"").replace(/^www\./i,"");
  const base = d.split(".")[0] || "";
  if(!base) return "";
  // jh-dental => JH Dental
  return base
    .split(/[-_]+/g)
    .filter(Boolean)
    .map(w => (w.length<=2 ? w.toUpperCase() : (w[0].toUpperCase()+w.slice(1))))
    .join(" ");
}

/* parse seed block */
function parseSeedInput(text){
  const t = String(text||"").trim();
  let company = "";
  let qs = [];

  const m1 = t.match(/firma\s*:\s*(.+)/i);
  if(m1 && m1[1]) company = m1[1].split("\n")[0].trim();

  const lines = t.split("\n").map(x=>x.trim()).filter(Boolean);
  for(const ln of lines){
    if(/^(-|\u2022|\*)\s+/.test(ln)){
      const q = ln.replace(/^(-|\u2022|\*)\s+/,"").trim();
      if(q) qs.push(q);
    }
  }

  if(qs.length<3){
    const parts = t.split(/[;]+/).map(x=>x.trim()).filter(Boolean);
    const probableQs = parts.filter(p => p.length>8 && (p.includes("?") || p.toLowerCase().startsWith("kolik") || p.toLowerCase().startsWith("jak") || p.toLowerCase().startsWith("kdy") || p.toLowerCase().startsWith("kde")));
    if(probableQs.length>=3) qs = probableQs.slice(0,3);
  }

  return { company, qs: qs.slice(0,3) };
}

/* BACKEND CALLS */
async function saveUrlToSheets(url){
  const payload = { name:"", phone:"", email:"", message:`Ukázka | URL: ${url} | Source: widget` };
  const r = await fetch("/.netlify/functions/lead",{
    method:"POST",
    headers:{ "content-type":"application/json" },
    body:JSON.stringify(payload)
  });
  const txt = await r.text();
  return { ok:r.ok, raw:txt };
}

/* CONTEXT */
function getContext(){ return localStorage.getItem(CONTEXT_KEY) || ""; }
function setContext(text){
  localStorage.setItem(CONTEXT_KEY, text || "");
  state.contextReady = !!(text && text.length > 80);
  saveState();
}

async function scrapeHomepage(url){
  const r = await fetch("/.netlify/functions/scrape",{
    method:"POST",
    headers:{ "content-type":"application/json" },
    body:JSON.stringify({ url })
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "Scrape failed");
  const text = String(d.text || d.content || d.body || "");
  if(!text) throw new Error("Scrape returned empty text");
  return text;
}

/* DEMO AI */
async function askDemoAI(text){
  const context = getContext();
  const r = await fetch("/.netlify/functions/search-demo",{
    method:"POST",
    headers:{ "content-type":"application/json" },
    body:JSON.stringify({
      message:text,
      thread_id:getThreadId(),
      context,
      site_url: state.url || ""
    })
  });
  const d = await r.json().catch(()=>({}));
  if(d.thread_id) setThreadId(d.thread_id);
  if(!d.ok) throw new Error(d.error || "search-demo failed");
  return d.answer || "";
}

/* MINI DEMO (lokální ukázka) */
function buildDemoCard(){
  const domain = prettyDomain(state.url || "");
  const name = (state.companyName || "").trim() || titleizeFromDomain(domain) || (domain ? domain : "vaši firmu");

  const raw = getContext();
  const lower = raw.toLowerCase();

  const hasEshop = lower.includes("košík") || lower.includes("doprava") || lower.includes("platba") || lower.includes("produkt");
  const hasBooking = lower.includes("rezerv") || lower.includes("objednat") || lower.includes("termín") || lower.includes("kalendář");

  let typeLabel = "služby";
  if(hasEshop) typeLabel = "e-shop";
  if(hasBooking) typeLabel = "rezervace / služby";

  const bullets = [
    "Odpovídá na časté dotazy (cena, termín, postup, služby)",
    "Navede zákazníka na správnou stránku / kontakt",
    "Sběr poptávek 24/7 a úspora času na telefonu"
  ];

  const seed = Array.isArray(state.seedQuestions) ? state.seedQuestions : [];
  const qas = seed.length===3 ? [
    {q: seed[0], a:"Chatbot odpoví stručně a srozumitelně, případně se doptá na 1–2 detaily."},
    {q: seed[1], a:"Chatbot vysvětlí postup a doporučí další krok (např. kontakt / termín)."},
    {q: seed[2], a:"Chatbot nasměruje zákazníka a nabídne rychlé řešení."},
  ] : [
    {q:"Kolik to stojí a co je v ceně?", a:"Chatbot dá orientační rámec a doptá se na pár detailů."},
    {q:"Jak rychle to umíte?", a:"Chatbot navrhne další krok a doptá se na termín/lokalitu."},
    {q:"Jaký je postup spolupráce?", a:"Chatbot popíše kroky a nabídne kontakt."},
  ];

  const flow = ["Co řešíte (stručně)", "Upřesnění (lokalita / rozsah)", "Kontakt pro domluvu"];

  return { name, domain, typeLabel, bullets, qas, flow };
}

function renderDemoPreview(){
  if(!state.url){
    add("bot","Nejdřív prosím zadejte web (Získat ukázku zdarma).");
    return;
  }

  const c = buildDemoCard();
  const bulletsHtml = c.bullets.map(t => `<li><span class="check">✓</span><span>${escapeHtml(t)}</span></li>`).join("");
  const qaHtml = c.qas.map(x => `
    <li style="margin-bottom:10px">
      <b style="display:block;color:rgba(255,255,255,.90);font-size:12px;margin-bottom:2px">❓ ${escapeHtml(x.q)}</b>
      <span style="color:rgba(255,255,255,.68);font-size:12.5px">💬 ${escapeHtml(x.a)}</span>
    </li>`).join("");
  const flowHtml = c.flow.map(s => `<li>${escapeHtml(s)}</li>`).join("");

  const subLine = getContext()
    ? `Mini ukázka (okamžitý náhled) • vychází z homepage (${c.typeLabel})`
    : `Mini ukázka (okamžitý náhled) • web nepovolil automatické načtení, ukázka je orientační`;

  const html = `
    <div class="demoCard">
      <div class="demoTitle">Ukázka pro firmu: ${escapeHtml(c.name)}</div>
      <div class="demoSub">${escapeHtml(subLine)}</div>

      <div class="demoBox">
        <b>Co by chatbot u vás dělal</b>
        <ul class="list">${bulletsHtml}</ul>
        <div style="margin-top:8px;color:rgba(255,255,255,.60);font-size:12px">
          Ukázka webu: <b style="color:rgba(255,255,255,.82)">${escapeHtml(c.domain || "—")}</b>
        </div>
      </div>

      <div class="demoBox">
        <b>Jak vypadá odpovídání (3 příklady) + mini flow</b>
        <ul style="margin:0;padding-left:16px">${qaHtml}</ul>
        <div style="margin-top:10px;color:rgba(255,255,255,.68);font-size:12.5px">
          <b style="display:block;font-size:12px;margin-bottom:6px">Sběr poptávky (rychle)</b>
          <ul style="margin:0;padding-left:16px">${flowHtml}</ul>
        </div>
      </div>

      <div class="miniActions">
        <span class="chip" data-demo="ask">Zeptejte se demo asistenta</span>
        <span class="chip alt" data-demo="seed">Upravit jméno + 3 dotazy</span>
      </div>
    </div>
  `;

  add("bot", html, true);

  const last = chat.lastElementChild;
  last.querySelectorAll("[data-demo]").forEach(el=>{
    el.addEventListener("click", ()=>handleDemoChip(el.dataset.demo));
  });

  state.demoShown = true;
  saveState();

  ensureContextBanner();
  add("bot","Teď se klidně ptejte — tohle je demo chatbota pro vaši firmu. 🙂");
}

function handleDemoChip(which){
  if(which==="seed"){
    setMode("seed");
    add("bot",
`Super — napište prosím:
• jméno firmy
• 3 nejčastější dotazy zákazníků

Příklad:
Firma: JH Dental
- Kolik stojí dentální hygiena?
- Jak rychle se dostanu na termín?
- Kde vás najdu / jaký máte kontakt?`);
    input.focus();
    return;
  }
  if(which==="ask"){
    setMode("chat");
    add("bot","Jasně — napište dotaz. 🙂");
    input.focus();
    return;
  }
}

/* MENU (✅ simplified to 2 tiles, no extra scrolling) */
function renderMenu(){
  const hasUrl = !!(state.urlSaved && state.url);

  const html = `
    <div>
      <b>Ukázku připravím pro váš web.</b><br>
      <span style="color:rgba(255,255,255,.68)">Vyberte jednu možnost:</span>
    </div>

    <div class="grid" style="margin-top:10px">
      <div class="tile" data-action="demo">
        <div class="k">
          <div class="ico">▶</div>
          <div>
            <b>Získat ukázku</b>
            <span>Zadáte web a hned uvidíte náhled</span>
          </div>
        </div>
      </div>

      <div class="tile" data-action="what">
        <div class="k">
          <div class="ico">⚙</div>
          <div>
            <b>Co umí chatbot?</b>
            <span>Stručný přehled</span>
          </div>
        </div>
      </div>
    </div>

    ${hasUrl ? `
      <div class="hint" style="margin-top:8px">
        Uložený web: <b style="color:rgba(255,255,255,.82)">${escapeHtml(prettyDomain(state.url))}</b>
        • napište „ukázka“ pro zobrazení náhledu.
      </div>
    ` : ``}
  `;
  add("bot", html, true);

  const last = chat.lastElementChild;
  last.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", ()=>handleMenuAction(el.dataset.action));
  });
}

function renderCapabilities(){
  const html = `
    <div><b>Co umí chatbot (stručně):</b></div>
    <ul class="list">
      <li><span class="check">✓</span><span>FAQ: cena, služby, termíny, postup</span></li>
      <li><span class="check">✓</span><span>Sběr poptávek a kvalifikace zájemců</span></li>
      <li><span class="check">✓</span><span>Navigace na správný kontakt / stránku</span></li>
    </ul>
    <div class="hint" style="margin-top:6px">Pro ukázku podle vašeho webu klikněte na „Získat ukázku“.</div>
  `;
  add("bot", html, true);
}

function handleMenuAction(action){
  if(action==="demo"){
    setMode("url");
    add("bot","Zadejte prosím web (stačí doména). Ukázku připravím hned.");
    addHint("Pozn.: Některé weby automatické načítání blokují — v tom případě ukážeme demo podle 3 vašich dotazů.");
    input.focus();
    return;
  }
  if(action==="what"){ renderCapabilities(); return; }
}

/* INTENT: “ukaž ukázku” */
function isAskingForDemo(text){
  const t = String(text||"").toLowerCase();
  return t.includes("ukazk") || t.includes("ukázk") || t.includes("nahled") || t.includes("náhled");
}

/* SEND */
async function send(){
  const t = input.value.trim();
  if(!t) return;

  if(t.toLowerCase()==="reset"){
    resetThread(); resetState();
    chat.innerHTML = "";
    init();
    input.value = "";
    return;
  }

  add("user", t);
  input.value = "";
  sendBtn.disabled = true;

  try{
    setStatus("pracuji…");

    // local "show demo" intent
    if(isAskingForDemo(t) && state.urlSaved && state.url){
      setMode("chat");
      renderDemoPreview();
      setStatus("připraveno");
      return;
    }

    // SEED mode: user provides company + 3 questions (fallback)
    if(state.mode==="seed"){
      const parsed = parseSeedInput(t);

      if(parsed.company) state.companyName = parsed.company;
      if(!state.companyName && state.url) state.companyName = titleizeFromDomain(prettyDomain(state.url));

      if(parsed.qs.length === 3){
        state.seedQuestions = parsed.qs;
        saveState();
        ensureContextBanner();
        setMode("chat");
        add("bot","Perfektní — mám jméno firmy i 3 dotazy. Připravuji ukázku… ✅");
        renderDemoPreview();
        setStatus("připraveno");
        return;
      }else{
        add("bot",
`Ještě mi prosím pošlete přesně 3 dotazy (nejlépe jako odrážky).
Příklad:
Firma: JH Dental
- Kolik stojí dentální hygiena?
- Jak rychle se dostanu na termín?
- Kde vás najdu / jaký máte kontakt?`);
        setStatus("čekám na 3 dotazy");
        return;
      }
    }

    // URL mode → save + try scrape + show demo
    if(state.mode==="url"){
      if(!looksValidUrl(t)){
        add("bot","Tohle nevypadá jako web. Zkuste prosím třeba „muj-web.cz“.");
        setStatus("čekám na web");
        return;
      }

      const url = normalizeUrl(t);
      state.url = url;
      if(!state.companyName) state.companyName = titleizeFromDomain(prettyDomain(url));
      saveState();

      const r = await saveUrlToSheets(url);
      if(!r.ok){
        if(DEBUG) add("bot","Chyba ukládání do Sheets:\n"+r.raw);
        add("bot","Omlouvám se, nepodařilo se to uložit. Zkuste to prosím znovu.");
        setStatus("chyba");
        return;
      }
      state.urlSaved = true;
      saveState();

      add("bot","Děkuji — mám to. ✅ Připravuji ukázku…");

      try{
        setStatus("načítám…");
        const txt = await scrapeHomepage(url);
        setContext(txt);
        add("bot","Hotovo — ukázka je připravená. ✅");
        setMode("chat");
        renderDemoPreview();
        setStatus("připraveno");
        return;
      }catch(e){
        setContext("");
        saveState();
        setMode("seed");
        add("bot","Tenhle web bohužel nedovolil automatické načtení (některé weby to blokují).");
        add("bot","Nevadí — napište jméno firmy a 3 typické dotazy zákazníků a ukážu demo odpovědí.");
        setStatus("čekám na jméno + 3 dotazy");
        if(DEBUG) add("bot","DEBUG scrape error: "+String(e));
        input.focus();
        return;
      }
    }

    // chat/menu → DEMO AI reply
    setMode("chat");

    if(!getContext() && !state.seedQuestions?.length){
      add("bot","Tip: Pro přesnější ukázku zadejte web (Získat ukázku) nebo doplňte 3 typické dotazy.");
    }

    const ans = await askDemoAI(t);
    add("bot", ans);
    setStatus("připraveno");

  }catch(e){
    if(DEBUG) add("bot","❌ Chyba:\n"+String(e));
    add("bot","Omlouvám se, něco se nepovedlo. Zkuste to prosím znovu.");
    setStatus("chyba");
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

/* EVENTS */
sendBtn.onclick = send;
input.addEventListener("keydown", e => (e.key==="Enter") && send());

/* INIT */
function init(){
  setStatus("připraveno");
  refreshTopBar();

  setMode("menu");

  if(state.urlSaved && state.url){
    const dom = prettyDomain(state.url);
    if(!state.companyName) state.companyName = titleizeFromDomain(dom);
    saveState();
    ensureContextBanner();

    add("bot", `Vítejte zpět 👋`);
    addTiny(`Uložený web: ${dom}`);
  } else {
    add("bot","Dobrý den 👋");
  }

  renderMenu();
}
init();
</script>
