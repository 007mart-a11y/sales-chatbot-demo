<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI-Proces | Sales Chatbot</title>

  <style>
    :root{
      --bg0: #070A12;
      --glass: rgba(255,255,255,.06);
      --glass2: rgba(255,255,255,.09);
      --stroke: rgba(255,255,255,.12);
      --txt: rgba(255,255,255,.90);
      --muted: rgba(255,255,255,.66);

      --brand: rgba(0, 230, 255, .95);
      --brand2: rgba(0, 160, 255, .95);

      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 18px;

      --bubbleUser: rgba(0, 200, 255, .18);
      --bubbleBot: rgba(255,255,255,.08);
      --bubbleStroke: rgba(255,255,255,.14);
    }

    *{ box-sizing: border-box; }
    html, body{
      height:100%;
      width:100%;
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial;
      background: var(--bg0);
      color: var(--txt);
      overflow:hidden;
    }
    a{ color: inherit; }

    body.embed-mode { background: transparent; }

    #appRoot{
      height:100%;
      width:100%;
      display:flex;
      align-items:stretch;
      justify-content:stretch;
      padding: 0;
    }

    .panel{
      width: 460px;
      height: 720px;
      border-radius: var(--radius);
      overflow:hidden;
      border: 1px solid var(--stroke);
      background:
        radial-gradient(1200px 800px at 15% 10%, rgba(0,200,255,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 20%, rgba(0,140,255,.12), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.04));
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      position: relative;
    }

    body.embed-mode .panel{
      width:100%;
      height:100%;
      border-radius: 14px;
      box-shadow: none;
      border: 1px solid rgba(255,255,255,.10);
    }

    .panel::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(to right, rgba(0,230,255,.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,230,255,.05) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity:.25;
      mask-image: radial-gradient(900px 600px at 50% 20%, black 55%, transparent 80%);
    }

    /* ===== HEADER ===== */
    .header{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.12));
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }

    .logoWrap{
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(0,255,255,.25);
      background: linear-gradient(180deg, rgba(0,230,255,.18), rgba(0,120,255,.10));
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      flex: 0 0 auto;
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .logoWrap img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .logoWrap svg{ color: rgba(0,230,255,.95); }

    .brandText{ min-width:0; }
    .brandTitle{
      font-weight: 900;
      letter-spacing: .2px;
      line-height: 1.05;
      font-size: 14px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .brandSub{
      font-size: 12px;
      color: var(--muted);
      line-height: 1.05;
      margin-top: 2px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .closeBtn{
      appearance:none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.85);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      cursor:pointer;
      display:grid;
      place-items:center;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }
    .closeBtn:hover{
      background: rgba(255,255,255,.09);
      border-color: rgba(0,255,255,.22);
      transform: translateY(-1px);
    }

    /* ===== HERO TILES ===== */
    .hero{
      position:relative;
      padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,.10);
      z-index: 2;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    }

    .tiles{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 520px){
      .tiles{ grid-template-columns: 1fr; }
    }

    .tile{
      position:relative;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(600px 320px at 20% 10%, rgba(0,220,255,.14), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      padding: 12px 12px 10px;
      min-height: 108px;
      cursor:pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease, filter .12s ease;
      overflow:hidden;
      user-select:none;
    }
    .tile:hover{
      transform: translateY(-1px);
      border-color: rgba(0,255,255,.22);
      filter: brightness(1.03);
    }

    .tile::after{
      content:"";
      position:absolute;
      inset:-2px;
      pointer-events:none;
      border-radius: 18px;
      background: radial-gradient(600px 260px at 30% 0%, rgba(0,230,255,.18), transparent 55%);
      opacity:.55;
      mask-image: linear-gradient(to bottom, black 55%, transparent 100%);
    }

    .tileKicker{
      display:flex;
      align-items:center;
      gap: 8px;
      font-weight: 900;
      letter-spacing:.2px;
      font-size: 13px;
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .tileDesc{
      font-size: 12px;
      line-height: 1.25;
      color: rgba(255,255,255,.70);
    }
    .tileIcon{
      width: 26px;
      height: 26px;
      border-radius: 10px;
      display:grid;
      place-items:center;
      border: 1px solid rgba(0,255,255,.22);
      background: rgba(0,220,255,.10);
      color: rgba(0,240,255,.95);
      flex: 0 0 auto;
    }

    .tile.primary{
      border-color: rgba(0,255,255,.26);
      background:
        radial-gradient(900px 420px at 30% 10%, rgba(0,220,255,.20), transparent 55%),
        linear-gradient(180deg, rgba(0,230,255,.10), rgba(255,255,255,.04));
      box-shadow: 0 14px 38px rgba(0,0,0,.25);
      animation: pulseGlow 2.6s ease-in-out infinite;
    }
    @keyframes pulseGlow{
      0%, 100%{
        box-shadow: 0 14px 38px rgba(0,0,0,.25), 0 0 0 rgba(0,230,255,.00);
        transform: translateY(0);
      }
      50%{
        box-shadow: 0 14px 38px rgba(0,0,0,.25), 0 0 28px rgba(0,230,255,.18);
        transform: translateY(-1px);
      }
    }

    .microRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top: 10px;
      gap: 10px;
    }
    .microHint{
      font-size: 12px;
      color: rgba(255,255,255,.62);
      line-height:1.2;
    }
    .microPill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,255,255,.18);
      background: rgba(0,220,255,.08);
      color: rgba(255,255,255,.86);
      font-weight: 800;
      font-size: 12px;
      white-space:nowrap;
    }

    /* ===== MESSAGES ===== */
    .messages{
      flex: 1 1 auto;
      overflow:auto;
      padding: 12px 14px 10px;
      scroll-behavior: smooth;
      z-index: 1;
    }
    .messages::-webkit-scrollbar{ width: 10px; }
    .messages::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.10); border-radius: 999px; }
    .messages::-webkit-scrollbar-track{ background: transparent; }

    .msgRow{
      display:flex;
      margin: 6px 0;
      gap: 10px;
      align-items:flex-end;
    }
    .msgRow.user{ justify-content:flex-end; }
    .msgRow.bot{ justify-content:flex-start; }

    .bubble{
      max-width: 84%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--bubbleStroke);
      background: var(--bubbleBot);
      line-height: 1.35;
      font-size: 14px;
      color: var(--txt);
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    .msgRow.user .bubble{
      background: var(--bubbleUser);
      border-color: rgba(0,255,255,.18);
    }

    .pill{
      display:inline-flex;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid rgba(0,255,255,.22);
      color: rgba(0,240,255,.95);
      background: rgba(0,220,255,.10);
      margin-right: 6px;
      vertical-align: middle;
    }
    .small{
      color: var(--muted);
      font-size: 13px;
    }
    .divider{
      height: 1px;
      background: rgba(255,255,255,.10);
      margin: 10px 0;
    }

    /* ✅ CHIPS (chybělo — používal jsi je v intro i nudge) */
    .chips{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .chip{
      appearance:none;
      border: 1px solid rgba(0,255,255,.20);
      background: rgba(0,210,255,.10);
      color: rgba(255,255,255,.92);
      font-weight: 800;
      padding: 8px 10px;
      border-radius: 999px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      font-size: 13px;
    }
    .chip:hover{
      transform: translateY(-1px);
      background: rgba(0,210,255,.14);
      border-color: rgba(0,255,255,.28);
    }

    /* ===== TYPING DOTS ===== */
    .typing{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
    }
    .typingDot{
      width: 7px; height: 7px; border-radius: 999px;
      background: rgba(255,255,255,.70);
      animation: bounce 1.2s infinite ease-in-out;
      opacity: .65;
    }
    .typingDot:nth-child(2){ animation-delay: .15s; }
    .typingDot:nth-child(3){ animation-delay: .30s; }
    @keyframes bounce{
      0%, 80%, 100%{ transform: translateY(0); opacity: .55; }
      40%{ transform: translateY(-6px); opacity: 1; }
    }

    /* ===== INPUT ===== */
    .composer{
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.30));
      display:flex;
      gap: 10px;
      align-items:flex-end;
      z-index: 2;
    }
    .inputWrap{
      flex: 1 1 auto;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      border-radius: 14px;
      padding: 10px 10px;
      display:flex;
      align-items:center;
      gap: 8px;
    }
    textarea{
      width:100%;
      resize:none;
      border:0;
      outline:none;
      background: transparent;
      color: rgba(255,255,255,.92);
      font-size: 14px;
      line-height: 1.35;
      max-height: 120px;
      min-height: 22px;
    }
    textarea::placeholder{ color: rgba(255,255,255,.45); }

    .sendBtn{
      appearance:none;
      border: 1px solid rgba(0,255,255,.22);
      background: linear-gradient(180deg, rgba(0,230,255,.28), rgba(0,140,255,.18));
      color: rgba(255,255,255,.95);
      font-weight: 900;
      letter-spacing: .2px;
      border-radius: 14px;
      padding: 12px 14px;
      cursor:pointer;
      transition: transform .12s ease, filter .12s ease;
      box-shadow: 0 12px 28px rgba(0,0,0,.28);
      white-space:nowrap;
    }
    .sendBtn:hover{ transform: translateY(-1px); filter: brightness(1.05); }
    .sendBtn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
      filter:none;
    }

    /* ===== MODAL (LEAD) ===== */
    .modalOverlay{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.60);
      backdrop-filter: blur(10px);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 50;
    }
    .modalOverlay.show{ display:flex; }
    .modal{
      width: min(560px, 100%);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(900px 520px at 20% 0%, rgba(0,220,255,.18), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05));
      box-shadow: 0 24px 80px rgba(0,0,0,.62);
      overflow:hidden;
    }
    .modalHead{
      padding: 12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom: 1px solid rgba(255,255,255,.10);
    }
    .modalTitle{ font-weight: 950; letter-spacing:.2px; }
    .modalClose{
      appearance:none;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.85);
      width: 34px;
      height: 34px;
      border-radius: 12px;
      cursor:pointer;
    }
    .modalBody{ padding: 14px; }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: 1fr; }
    }
    .field label{
      display:block;
      font-size: 12px;
      color: rgba(255,255,255,.68);
      margin: 0 0 6px;
      font-weight: 800;
    }
    .field input, .field textarea, .field select{
      width:100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.92);
      padding: 10px 10px;
      outline:none;
      font-size: 14px;
    }
    .field textarea{ min-height: 88px; resize: vertical; }

    .modalActions{
      display:flex;
      gap: 10px;
      justify-content:flex-end;
      padding: 0 14px 14px;
    }
    .btn{
      appearance:none;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 950;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      cursor:pointer;
    }
    .btnPrimary{
      border: 1px solid rgba(0,255,255,.22);
      background: linear-gradient(180deg, rgba(0,230,255,.28), rgba(0,140,255,.18));
    }
    .hint{
      font-size: 12px;
      color: rgba(255,255,255,.62);
      margin-top: 10px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <div id="appRoot"></div>

  <script>
    /******************************************************************
     * KONFIG
     ******************************************************************/
    const APP_ORIGIN = "https://sales-chatbot-demo.netlify.app";
    const ENDPOINT_SEARCH = APP_ORIGIN + "/.netlify/functions/search";
    const ENDPOINT_LEAD  = APP_ORIGIN + "/.netlify/functions/lead";

    // Sem dej URL na logo (např. "/logo.png" z Netlify public), nebo nech prázdné.
    const LOGO_URL = "";

    const LS_THREAD = "sales_chatbot_thread_id_v2";
    const LS_MSG_COUNT = "sales_chatbot_user_msg_count_sales_v1";
    const LS_NUDGE_DONE = "sales_chatbot_sales_nudge_done_v1";

    const params = new URLSearchParams(location.search);
    const IS_EMBED = params.get("embed") === "1";

    function el(tag, attrs={}, children=[]){
      const node = document.createElement(tag);
      for(const [k,v] of Object.entries(attrs)){
        if(k === "class") node.className = v;
        else if(k === "html") node.innerHTML = v;
        else if(k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      }
      for(const c of children){
        if(c == null) continue;
        if(typeof c === "string") node.appendChild(document.createTextNode(c));
        else node.appendChild(c);
      }
      return node;
    }

    function escapeHtml(str){
      return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function setThreadId(id){ if(id) localStorage.setItem(LS_THREAD, id); }
    function getThreadId(){ return localStorage.getItem(LS_THREAD) || ""; }
    function resetThread(){ localStorage.removeItem(LS_THREAD); }

    function setUserCount(n){ localStorage.setItem(LS_MSG_COUNT, String(n)); }
    function getUserCount(){ return parseInt(localStorage.getItem(LS_MSG_COUNT) || "0", 10) || 0; }

    function markNudgeDone(){ localStorage.setItem(LS_NUDGE_DONE, "1"); }
    function isNudgeDone(){ return localStorage.getItem(LS_NUDGE_DONE) === "1"; }

    /******************************************************************
     * UI BUILD
     ******************************************************************/
    if(IS_EMBED) document.body.classList.add("embed-mode");

    const root = document.getElementById("appRoot");
    const panel = el("div", { class: "panel", role:"region", "aria-label":"AI-Proces Sales Chatbot" });

    // Header
    const header = el("div", { class: "header" });
    const brand = el("div", { class: "brand" });
    const logoWrap = el("div", { class:"logoWrap", title:"AI-Proces" });

    if(LOGO_URL){
      logoWrap.appendChild(el("img", { src: LOGO_URL, alt:"AI-Proces logo" }));
    }else{
      logoWrap.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8V4H8"></path>
          <rect width="16" height="12" x="4" y="8" rx="2"></rect>
          <path d="M2 14h2"></path>
          <path d="M20 14h2"></path>
          <path d="M15 13v2"></path>
          <path d="M9 13v2"></path>
        </svg>
      `;
    }

    const brandText = el("div", { class:"brandText" }, [
      el("div", { class:"brandTitle" }, ["AI-Proces"]),
      el("div", { class:"brandSub" }, ["Sales konzultant • obce / živnostníci / firmy"])
    ]);

    brand.appendChild(logoWrap);
    brand.appendChild(brandText);

    const messages = el("div", { class:"messages", id:"messages" });

    function scrollToBottom(){ messages.scrollTop = messages.scrollHeight; }

    function addMessage(role, html){
      const row = el("div", { class: "msgRow " + (role === "user" ? "user" : "bot") });
      const bubble = el("div", { class: "bubble", html });
      row.appendChild(bubble);
      messages.appendChild(row);
      scrollToBottom();
      return row;
    }

    const closeBtn = el("button", {
      class:"closeBtn",
      "aria-label":"Zavřít",
      onclick: () => {
        if(IS_EMBED){
          addMessage("bot", `<span class="pill">INFO</span>Okno můžete kdykoliv znovu otevřít na stránce.`);
          scrollToBottom();
        }else{
          panel.style.display = "none";
        }
      }
    }, ["×"]);

    header.appendChild(brand);
    header.appendChild(closeBtn);

    // Hero tiles
    const hero = el("div", { class:"hero" });
    const tiles = el("div", { class:"tiles" });

    const tile1 = el("div", { class:"tile", role:"button", tabindex:"0" });
    tile1.innerHTML = `
      <div class="tileKicker"><span class="tileIcon">🤖</span>Co asistent umí</div>
      <div class="tileDesc">FAQ, poptávky, navigace, úspora času. Pro obce i podnikání.</div>
    `;

    const tile2 = el("div", { class:"tile primary", role:"button", tabindex:"0" });
    tile2.innerHTML = `
      <div class="tileKicker"><span class="tileIcon">✨</span>Chci to nasadit</div>
      <div class="tileDesc">Vyplňte kontakt + popis a připravíme návrh řešení na míru.</div>
    `;

    const tile3 = el("div", { class:"tile", role:"button", tabindex:"0" });
    tile3.innerHTML = `
      <div class="tileKicker"><span class="tileIcon">💬</span>Zeptejte se</div>
      <div class="tileDesc">Napište dotaz do chatu (cena, použití, postup nasazení).</div>
    `;

    tiles.appendChild(tile1);
    tiles.appendChild(tile2);
    tiles.appendChild(tile3);

    const microRow = el("div", { class:"microRow" }, [
      el("div", { class:"microHint" }, ["Tip: hlavní cesta je „Chci to nasadit“ – zabere to 30–60 s."]),
      el("div", { class:"microPill" }, ["⚡ Rychlá poptávka"])
    ]);

    hero.appendChild(tiles);
    hero.appendChild(microRow);

    // Composer
    const composer = el("div", { class:"composer" });
    const inputWrap = el("div", { class:"inputWrap" });
    const ta = el("textarea", { id:"msg", rows:"1", placeholder:"Napište dotaz… (např. jak to funguje / cena / nasazení)" });
    inputWrap.appendChild(ta);

    const sendBtn = el("button", { class:"sendBtn", id:"sendBtn" }, ["Odeslat"]);
    composer.appendChild(inputWrap);
    composer.appendChild(sendBtn);

    // Modal (Lead)
    const modalOverlay = el("div", { class:"modalOverlay", id:"modalOverlay" });
    const modal = el("div", { class:"modal" });
    const modalHead = el("div", { class:"modalHead" });
    const modalTitle = el("div", { class:"modalTitle" }, ["Rychlá poptávka (ukázka až po kontaktu)"]);
    const modalClose = el("button", { class:"modalClose", onclick: ()=>hideModal(), "aria-label":"Zavřít" }, ["×"]);
    modalHead.appendChild(modalTitle);
    modalHead.appendChild(modalClose);

    const modalBody = el("div", { class:"modalBody" });
    const form = el("form", { id:"leadForm" });
    const grid = el("div", { class:"grid" });

    function field(label, type, name, placeholder){
      return el("div", { class:"field" }, [
        el("label", {}, [label]),
        el("input", { type, name, placeholder })
      ]);
    }

    function selectField(label, name, options){
      const sel = el("select", { name });
      options.forEach(o => sel.appendChild(el("option", { value:o.value }, [o.label])));
      return el("div", { class:"field" }, [
        el("label", {}, [label]),
        sel
      ]);
    }

    const fOrg = selectField("Typ (obec / živnostník / firma)", "orgType", [
      { value:"", label:"Vyberte…" },
      { value:"Obec", label:"Obec" },
      { value:"Živnostník", label:"Živnostník" },
      { value:"Firma", label:"Firma" },
      { value:"Jiné", label:"Jiné" },
    ]);

    const fWeb   = field("Web / doména (volitelné)", "text", "web", "např. mesto.cz / firma.cz");
    const fName  = field("Jméno", "text", "name", "Jan Novák");
    const fPhone = field("Telefon", "tel", "phone", "777 123 456");
    const fEmail = field("E-mail", "email", "email", "jan@email.cz");

    grid.appendChild(fOrg);
    grid.appendChild(fWeb);
    grid.appendChild(fName);
    grid.appendChild(fPhone);

    const fNeed = el("div", { class:"field" }, [
      el("label", {}, ["Co má asistent řešit? (stručně)"]),
      el("textarea", { name:"message", placeholder:"Např. odpady a poplatky pro občany / objednávky a ceník / sběr poptávek / FAQ…" })
    ]);

    const hint = el("div", { class:"hint" }, [
      "V chatu ukázky neposíláme. Po odeslání kontaktu připravíme návrh řešení na míru."
    ]);

    form.appendChild(grid);
    form.appendChild(el("div", { style:"height:10px" }));
    form.appendChild(fNeed);
    form.appendChild(hint);

    const actions = el("div", { class:"modalActions" });
    const btnCancel = el("button", { type:"button", class:"btn", onclick: ()=>hideModal() }, ["Zavřít"]);
    const btnSend = el("button", { type:"submit", class:"btn btnPrimary", id:"leadSubmit" }, ["Odeslat poptávku"]);
    actions.appendChild(btnCancel);
    actions.appendChild(btnSend);

    modalBody.appendChild(form);
    modal.appendChild(modalHead);
    modal.appendChild(modalBody);
    modal.appendChild(actions);
    modalOverlay.appendChild(modal);

    panel.appendChild(modalOverlay);
    panel.appendChild(header);
    panel.appendChild(hero);
    panel.appendChild(messages);
    panel.appendChild(composer);
    root.appendChild(panel);

    function showModal(){
      modalOverlay.classList.add("show");
      setTimeout(()=>{
        try{ form.querySelector('select[name="orgType"]').focus(); }catch(e){}
      }, 80);
    }
    function hideModal(){ modalOverlay.classList.remove("show"); }

    function addTyping(){
      const row = el("div", { class: "msgRow bot" });
      const bubble = el("div", { class: "typing", "aria-label": "Generuje se odpověď" }, [
        el("span", { class:"typingDot" }),
        el("span", { class:"typingDot" }),
        el("span", { class:"typingDot" }),
      ]);
      row.appendChild(bubble);
      row.dataset.typing = "1";
      messages.appendChild(row);
      scrollToBottom();
      return row;
    }
    function removeTyping(){
      const t = messages.querySelector('[data-typing="1"]');
      if(t) t.remove();
    }

    async function callAssistant(userText){
      const thread_id = getThreadId() || undefined;
      const payload = { message: userText };
      if(thread_id) payload.thread_id = thread_id;

      const res = await fetch(ENDPOINT_SEARCH, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(()=>null);
      if(!data || data.ok !== true){
        const err = data?.error || "Chyba serveru";
        const det = data?.details ? ("<div class='small' style='margin-top:6px'>" + escapeHtml(String(data.details)) + "</div>") : "";
        return { ok:false, answer: `Omlouvám se, něco se nepovedlo. (${escapeHtml(err)})${det}` };
      }

      if(data.thread_id) setThreadId(data.thread_id);
      return { ok:true, answer: data.answer || "OK" };
    }

    function maybeLeadNudge(){
      const count = getUserCount();
      if(isNudgeDone()) return;
      if(count < 3) return;

      markNudgeDone();

      addMessage("bot", `
        <span class="pill">TIP</span>
        Pokud chcete nasazení řešit konkrétně, pošlete kontakt a krátký popis.
        <div class="chips">
          <button class="chip" data-action="openLead">Otevřít poptávku</button>
          <button class="chip" data-action="continue">Pokračovat v dotazu</button>
        </div>
      `);

      const last = messages.lastElementChild;
      last.querySelector('[data-action="openLead"]').addEventListener("click", ()=> showModal());
      last.querySelector('[data-action="continue"]').addEventListener("click", ()=>{
        addMessage("bot", `<span class="pill">OK</span>Jasně. Napište, co přesně chcete vyřešit.`);
        try{ ta.focus({preventScroll:true}); }catch(e){ ta.focus(); }
      });
    }

    async function sendUserText(text){
      const t = (text || "").trim();
      if(!t) return;

      addMessage("user", escapeHtml(t));
      ta.value = "";
      autosize(ta);

      const cnt = getUserCount() + 1;
      setUserCount(cnt);

      addTyping();
      sendBtn.disabled = true;

      try{
        const out = await callAssistant(t);
        removeTyping();
        addMessage("bot", out.answer);
      }catch(e){
        removeTyping();
        addMessage("bot", `Omlouvám se, došlo k chybě. Zkuste to prosím znovu.`);
      }finally{
        sendBtn.disabled = false;
        scrollToBottom();
        maybeLeadNudge();
      }
    }

    function autosize(textarea){
      textarea.style.height = "auto";
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
    }

    /******************************************************************
     * EVENTS: tiles + input
     ******************************************************************/
    tile1.addEventListener("click", ()=>{
      sendUserText("Co všechno může asistent/chatbot dělat pro obec, živnostníka nebo firmu?");
    });
    tile2.addEventListener("click", ()=>{
      showModal();
      addMessage("bot", `<span class="pill">INFO</span>Super — vyplňte prosím kontakt a stručný popis. Ukázky řešíme až po kontaktu.`);
    });
    tile3.addEventListener("click", ()=>{
      addMessage("bot", `<span class="pill">OK</span>Napište, co vás zajímá (cena, postup, použití pro obec / podnikání).`);
      try{ ta.focus({ preventScroll:true }); }catch(e){ ta.focus(); }
    });

    [tile1, tile2, tile3].forEach(tl=>{
      tl.addEventListener("keydown", (e)=>{
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          tl.click();
        }
      });
    });

    ta.addEventListener("input", ()=>autosize(ta));
    ta.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendBtn.click();
      }
    });
    sendBtn.addEventListener("click", ()=> sendUserText(ta.value));

      /******************************************************************
     * FORM SUBMIT (LEAD → Sheets)
     ******************************************************************/
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const submitBtn = document.getElementById("leadSubmit");
      submitBtn.disabled = true;

      const fd = new FormData(form);
      const orgType = (fd.get("orgType") || "").toString().trim();
      const web = (fd.get("web") || "").toString().trim();
      const name = (fd.get("name") || "").toString().trim();
      const phone = (fd.get("phone") || "").toString().trim();
      const email = (fd.get("email") || "").toString().trim();
      const message = (fd.get("message") || "").toString().trim();

      if(!message){
        submitBtn.disabled = false;
        addMessage("bot", `<span class="pill">INFO</span>Doplňte prosím stručně, co má asistent řešit.`);
        return;
      }
      if(!name){
        submitBtn.disabled = false;
        addMessage("bot", `<span class="pill">INFO</span>Doplňte prosím jméno.`);
        return;
      }
      if(!phone){
        submitBtn.disabled = false;
        addMessage("bot", `<span class="pill">INFO</span>Doplňte prosím telefon.`);
        return;
      }
      if(!email){
        submitBtn.disabled = false;
        addMessage("bot", `<span class="pill">INFO</span>Ještě potřebuji doplnit váš e-mail, prosím.`);
        return;
      }

      try{
        const payload = {
          orgType,
          web,
          name,
          phone,
          email,
          message: (orgType ? `[${orgType}] ` : "") + message
        };

        const res = await fetch(ENDPOINT_LEAD, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(payload)
        });

        try{ await res.json(); } catch(_) {}

        hideModal();

        addMessage("bot", `<span class="pill">OK</span>Děkuji, mám vše. ✅`);
        addMessage("bot", `<div class="small">Chcete ještě doplnit, kde má asistent nejčastěji pomáhat? (web / Messenger / interně / infokiosek)</div>`);
      }catch(err){
        addMessage("bot", `<span class="pill">CHYBA</span>Nepodařilo se odeslat poptávku. Zkuste to prosím znovu.`);
      }finally{
        submitBtn.disabled = false;
      }
    });

    /******************************************************************
     * INIT
     ******************************************************************/
    function intro(){
      addMessage("bot", `
        <div style="font-weight:900; letter-spacing:.2px; margin-bottom:6px;">
          <span class="pill">START</span>AI asistent pro obce, živnostníky i firmy
        </div>
        <div class="small">
          Napište, co potřebujete vyřešit. Vysvětlím možnosti a postup nasazení.
          Pokud budete chtít pokračovat, klikněte na <b>„Chci to nasadit“</b> a odešlete kontakt.
        </div>
        <div class="divider"></div>
        <div class="chips">
          <button class="chip" data-q="Jak to funguje a jak probíhá nasazení?">Postup nasazení</button>
          <button class="chip" data-q="K čemu se to hodí pro obec?">Použití pro obec</button>
          <button class="chip" data-q="K čemu se to hodí pro živnostníka nebo firmu?">Použití pro podnikání</button>
          <button class="chip" data-q="Kolik to zhruba stojí?">Cena</button>
        </div>
      `);

      const last = messages.lastElementChild;
      last.querySelectorAll(".chip").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const q = btn.getAttribute("data-q") || btn.textContent.trim();
          sendUserText(q);
        });
      });
    }

    intro();
    setTimeout(()=>{
      try{ ta.focus({ preventScroll:true }); }catch(e){ ta.focus(); }
    }, 200);

  </script>
</body>
</html>
